ay_type\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_rgba_strafebot","shown":"mdd_player_trajectory_rgba_strafebot","kind":"cvar","group":"trajectory","default":"0 .5 0 .5","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_rgba_strafebot <r> <g> <b> <a>"],"summary":"Colour of the strafebot model's samples.","sections":[["Information","Colour and opacity of the strafebot model's samples, each 0..1. Default 0 .5 0 .5."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_rgba_strafebot 0 .5 0 .5","Default."],["mdd_player_trajectory_rgba_strafebot 1 1 1 .3","Faint white."]],"related":["mdd_player_trajectory_strafe_modes","mdd_player_trajectory_display_type"],"txt":"==========================================\nCVAR: mdd_player_trajectory_rgba_strafebot\n==========================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n----------------------------------------------------\nmdd_player_trajectory_rgba_strafebot <r> <g> <b> <a>\n----------------------------------------------------\n\n--------------\n1. Information\n--------------\nColour of the strafebot model's samples.\n\nColour and opacity of the strafebot model's samples, each 0..1. Default 0 .5 0 .5.\n\nDefault: \"0 .5 0 .5\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_rgba_strafebot 0 .5 0 .5\n    Default.\n\nmdd_player_trajectory_rgba_strafebot 1 1 1 .3\n    Faint white.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_strafe_modes, mdd_player_trajectory_display_type\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_rgba_accel","shown":"mdd_player_trajectory_rgba_accel","kind":"cvar","group":"trajectory","default":".4 .4 0 .4","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_rgba_accel <r> <g> <b> <a>"],"summary":"Colour of the accel model's samples.","sections":[["Information","Colour and opacity of the accel model's samples, each 0..1. Default .4 .4 0 .4."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_rgba_accel .4 .4 0 .4","Default."],["mdd_player_trajectory_rgba_accel 1 1 1 .3","Faint white."]],"related":["mdd_player_trajectory_strafe_modes","mdd_player_trajectory_display_type"],"txt":"======================================\nCVAR: mdd_player_trajectory_rgba_accel\n======================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n------------------------------------------------\nmdd_player_trajectory_rgba_accel <r> <g> <b> <a>\n------------------------------------------------\n\n--------------\n1. Information\n--------------\nColour of the accel model's samples.\n\nColour and opacity of the accel model's samples, each 0..1. Default .4 .4 0 .4.\n\nDefault: \".4 .4 0 .4\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_rgba_accel .4 .4 0 .4\n    Default.\n\nmdd_player_trajectory_rgba_accel 1 1 1 .3\n    Faint white.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_strafe_modes, mdd_player_trajectory_display_type\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_rgba_jump","shown":"mdd_player_trajectory_rgba_jump","kind":"cvar","group":"trajectory","default":".8 0 0 .8","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_rgba_jump <r> <g> <b> <a>"],"summary":"Colour of jump frames of any model.","sections":[["Information","Colour and opacity of jump frames of any model, each 0..1. Default .8 0 0 .8."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_rgba_jump .8 0 0 .8","Default."],["mdd_player_trajectory_rgba_jump 1 1 1 .3","Faint white."]],"related":["mdd_player_trajectory_strafe_modes","mdd_player_trajectory_display_type"],"txt":"=====================================\nCVAR: mdd_player_trajectory_rgba_jump\n=====================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n-----------------------------------------------\nmdd_player_trajectory_rgba_jump <r> <g> <b> <a>\n-----------------------------------------------\n\n--------------\n1. Information\n--------------\nColour of jump frames of any model.\n\nColour and opacity of jump frames of any model, each 0..1. Default .8 0 0 .8.\n\nDefault: \".8 0 0 .8\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_rgba_jump .8 0 0 .8\n    Default.\n\nmdd_player_trajectory_rgba_jump 1 1 1 .3\n    Faint white.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_strafe_modes, mdd_player_trajectory_display_type\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_rgba_trigger","shown":"mdd_player_trajectory_rgba_trigger","kind":"cvar","group":"trajectory","default":"0 .5 1 .5","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_rgba_trigger <r> <g> <b> <a>"],"summary":"Colour of the frame that touches a teleporter.","sections":[["Information","Colour and opacity of the frame that touches a teleporter, each 0..1. Default 0 .5 1 .5."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_rgba_trigger 0 .5 1 .5","Default."],["mdd_player_trajectory_rgba_trigger 1 1 1 .3","Faint white."]],"related":["mdd_player_trajectory_strafe_modes","mdd_player_trajectory_display_type"],"txt":"========================================\nCVAR: mdd_player_trajectory_rgba_trigger\n========================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n--------------------------------------------------\nmdd_player_trajectory_rgba_trigger <r> <g> <b> <a>\n--------------------------------------------------\n\n--------------\n1. Information\n--------------\nColour of the frame that touches a teleporter.\n\nColour and opacity of the frame that touches a teleporter, each 0..1. Default 0 .5 1 .5.\n\nDefault: \"0 .5 1 .5\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_rgba_trigger 0 .5 1 .5\n    Default.\n\nmdd_player_trajectory_rgba_trigger 1 1 1 .3\n    Faint white.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_strafe_modes, mdd_player_trajectory_display_type\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_shader_line","shown":"mdd_player_trajectory_shader_line","kind":"cvar","group":"trajectory","default":"railCore","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_shader_line <shader>"],"summary":"Shader used for the connecting line.","sections":[["Information","Shader NAME (not an image path) for the connecting line. Takes effect immediately. A custom look needs a .shader script in a pk3 that defines the name."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_shader_line railCore","Default."]],"related":["mdd_player_trajectory_shader_box","mdd_player_trajectory_display_type"],"txt":"=======================================\nCVAR: mdd_player_trajectory_shader_line\n=======================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n------------------------------------------\nmdd_player_trajectory_shader_line <shader>\n------------------------------------------\n\n--------------\n1. Information\n--------------\nShader used for the connecting line.\n\nShader NAME (not an image path) for the connecting line. Takes effect immediately. A custom look needs a .shader script in a pk3 that defines the name.\n\nDefault: \"railCore\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_shader_line railCore\n    Default.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_shader_box, mdd_player_trajectory_display_type\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_shader_box","shown":"mdd_player_trajectory_shader_box","kind":"cvar","group":"trajectory","default":"bbox_nocull","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_shader_box <shader>"],"summary":"Shader used for the boxes and footprints.","sections":[["Information","Shader NAME (not an image path) for every drawn box and footprint. Takes effect immediately. A custom look needs a .shader script in a pk3 that defines the name."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_shader_box bbox_nocull","Default."]],"related":["mdd_player_trajectory_shader_line","mdd_player_trajectory_display_type"],"txt":"======================================\nCVAR: mdd_player_trajectory_shader_box\n======================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n-----------------------------------------\nmdd_player_trajectory_shader_box <shader>\n-----------------------------------------\n\n--------------\n1. Information\n--------------\nShader used for the boxes and footprints.\n\nShader NAME (not an image path) for every drawn box and footprint. Takes effect immediately. A custom look needs a .shader script in a pk3 that defines the name.\n\nDefault: \"bbox_nocull\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_shader_box bbox_nocull\n    Default.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_shader_line, mdd_player_trajectory_display_type\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_debug","shown":"mdd_player_trajectory_debug","kind":"cvar","group":"trajectory","default":"0","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_debug <0..5>"],"summary":"Developer output for the trajectory prediction.","sections":[["Information","Verbosity level, not needed for normal use. 1 every simulated frame, 2 the next predicted jump frame, 3 the strafebot steering chain once per jump, 4 the first 10 frames every render frame, 5 the gathered entities and triggers. Any nonzero level also prints a timing line. Capture with \\logfile 2."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["logfile 2; mdd_player_trajectory_debug 2","Log the timing line to see what the prediction costs on this map."],["mdd_player_trajectory_debug 0","Off."]],"related":["mdd_player_trajectory_frames","mdd_player_trajectory_trace_entities"],"txt":"=================================\nCVAR: mdd_player_trajectory_debug\n=================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n----------------------------------\nmdd_player_trajectory_debug <0..5>\n----------------------------------\n\n--------------\n1. Information\n--------------\nDeveloper output for the trajectory prediction.\n\nVerbosity level, not needed for normal use. 1 every simulated frame, 2 the next predicted jump frame, 3 the strafebot steering chain once per jump, 4 the first 10 frames every render frame, 5 the gathered entities and triggers. Any nonzero level also prints a timing line. Capture with \\logfile 2.\n\nDefault: \"0\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nlogfile 2; mdd_player_trajectory_debug 2\n    Log the timing line to see what the prediction costs on this map.\n\nmdd_player_trajectory_debug 0\n    Off.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_frames, mdd_player_trajectory_trace_entities\nmdd_help mdd for the overview.\n"}]};
const E = DATA.entries, BY = Object.fromEntries(E.map(e => [e.name, e]));
const GROUP = Object.fromEntries(DATA.groups.map(g => [g.id, g.name]));
const KINDS = [["all", "All"], ["cvar", "Cvars"], ["button", "Buttons"], ["command", "Commands"]];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const state = { q: "", kind: "all", group: "all" };
let visible = [];
const folded = new Set();
try { JSON.parse(localStorage.getItem("folded") || "[]").forEach(g => GROUP[g] && folded.add(g)); } catch (_) {}
function saveFolds() { try { localStorage.setItem("folded", JSON.stringify([...folded])); } catch (_) {} }

E.forEach(e => {
  e.hay = [e.shown, e.name, e.summary, e.usage.join(" "), e.sections.map(s => s.join(" ")).join(" "),
    e.examples.map(x => x.join(" ")).join(" "), GROUP[e.group], e.added, e.default || ""].join(" ").toLowerCase();
});

function isKind(e, k) { return k === "all" || e.kind.split("+").includes(k); }

function score(e, terms) {
  let s = 0;
  for (const t of terms) {
    const n = e.name.indexOf(t);
    if (n >= 0) s += 100 - Math.min(n, 50);
    else if (e.summary.toLowerCase().includes(t)) s += 20;
    else if (e.hay.includes(t)) s += 1;
    else return -1;
  }
  return s;
}

function hi(text, terms) {
  let out = esc(text);
  if (!terms.length) return out;
  const re = new RegExp("(" + terms.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")", "gi");
  return out.replace(re, "<mark>$1</mark>");
}

function renderList() {
  const terms = state.q.toLowerCase().replace(/^\+/, "").split(/\s+/).filter(Boolean);
  let rows = E.filter(e => isKind(e, state.kind) && (state.group === "all" || e.group === state.group))
    .map(e => ({ e, s: score(e, terms) })).filter(r => r.s >= 0);
  const ranked = terms.length > 0;
  if (ranked) rows.sort((a, b) => b.s - a.s);
  const n = {};
  rows.forEach(r => (n[r.e.group] = (n[r.e.group] || 0) + 1));
  $("foldAll").disabled = $("unfoldAll").disabled = ranked;
  visible = rows.filter(r => ranked || !folded.has(r.e.group)).map(r => r.e.name);
  const cur = current();
  let html = "", last = null;
  for (const { e } of rows) {
    if (!ranked && e.group !== last) {
      html += `<button class="grp" data-g="${e.group}" aria-expanded="${!folded.has(e.group)}">${esc(GROUP[e.group])}<span class="c">${n[e.group]}</span></button>`;
      last = e.group;
    }
    if (!ranked && folded.has(e.group)) continue;
    html += `<a class="row" href="#${e.name}" data-n="${e.name}"${e.name === cur ? ' aria-current="true"' : ""}>
      <span class="n"><i class="dot k-${e.kind.replace("+", "")}" title="${e.kind}"></i><span>${hi(e.shown, terms)}</span></span>
      <span class="s">${hi(e.summary, terms)}</span></a>`;
  }
  $("list").innerHTML = html || `<div class="none">Nothing matches. Try fewer words, or clear the filters.</div>`;
  $("count").textContent = `${rows.length} of ${E.length}`;
}

function linkify(text, self) {
  return esc(text).replace(/\+?mdd_[a-z0-9_]+/g, m => {
    const n = m.replace(/^\+/, "");
    return BY[n] && n !== self ? `<a href="#${n}">${m}</a>` : m;
  });
}

function cmd(text) {
  return `<div class="cmd"><code>${esc(text)}</code><button class="copy" data-copy="${esc(text)}">copy</button></div>`;
}

function renderIntro() {
  const c = k => E.filter(e => isKind(e, k)).length;
  $("main").innerHTML = `<div class="doc intro">
    <h1 class="name" style="text-transform:none;letter-spacing:0;color:var(--ink)">Reference</h1>
    <p class="lead">Every cvar, hold button and console command that ${esc(DATA.project)} adds to the mDd DeFRaG proxymod:
      ${E.length} names, each with its full help text, usage examples and the date it was added.</p>
    <p>Pick a name on the left or start typing. Search looks through names, descriptions, help text and examples.</p>
    <table>
      <tr><td><i class="dot k-cvar" style="display:inline-block"></i> cvar</td><td>${c("cvar")} settings, set like any cvar: <code>mdd_grenade_lead 16</code></td></tr>
      <tr><td><i class="dot k-button" style="display:inline-block"></i> button</td><td>${c("button")} hold buttons, bound like +attack: <code>bind mouse2 +mdd_jumpshoot</code></td></tr>
      <tr><td><i class="dot k-command" style="display:inline-block"></i> command</td><td>${c("command")} console commands: <code>mdd_replay_record run1</code></td></tr>
    </table>
    <p>In game the same text is available with <code>mdd_help &lt;name&gt;</code> or <code>? &lt;name&gt;</code> once the
      <code>help/</code> folder is copied into <code>defrag/system/help/</code>.</p>
    <p class="keys"><kbd>/</kbd> search &nbsp; <kbd>&uarr;</kbd> <kbd>&darr;</kbd> move &nbsp; <kbd>Esc</kbd> clear</p>
    <p style="color:var(--muted);font-size:13px">Dates are the UTC date of the first commit that contained the name.</p>
  </div>`;
}

function renderDetail(e) {
  const kinds = e.kind.split("+").map(k => `<li class="badge ${k}">${k}</li>`).join("");
  const facts = kinds +
    (e.default !== null ? `<li><span>default</span> ${e.default === "" ? '""' : esc(e.default)}</li>` : "") +
    `<li title="${esc(e.addedNote || "UTC date of the first commit")}"><span>added</span> ${e.added}</li>` +
    `<li><span>group</span> ${esc(GROUP[e.group])}</li>`;
  let h = `<div class="doc"><a class="back" href="#">&larr; all entries</a>
    <h1 class="name" style="text-transform:none;letter-spacing:0;color:var(--ink)">${esc(e.kind === "cvar+button" ? e.name + "  /  +" + e.name : e.shown)}</h1>
    <p class="lead">${esc(e.summary)}</p><ul class="facts">${facts}</ul>`;
  if (e.addedNote) h += `<p style="color:var(--muted);font-size:13.5px;margin-top:-10px">${esc(e.addedNote[0].toUpperCase() + e.addedNote.slice(1))}.</p>`;
  h += `<h2>Syntax</h2>` + e.usage.map(cmd).join("");
  for (const [t, body] of e.sections)
    h += `<h2>${esc(t)}</h2>` + body.split("\n\n").map(p => `<p>${linkify(p, e.name)}</p>`).join("");
  h += `<h2>Usage examples</h2>` + e.examples.map(([c, w]) => `<div class="ex">${cmd(c)}<p>${linkify(w, e.name)}</p></div>`).join("");
  if (e.related.length)
    h += `<h2>See also</h2><div class="rel">` + e.related.map(r => `<a href="#${r}">${esc(BY[r].shown)}</a>`).join("") + `</div>`;
  h += `<details><summary>In-game help file: ? ${e.name} &nbsp;(help/${e.name}.txt)</summary><pre>${esc(e.txt)}</pre></details></div>`;
  $("main").innerHTML = h;
  $("main").scrollTop = 0;
}

function current() { const n = decodeURIComponent(location.hash.slice(1)); return BY[n] ? n : ""; }

function route() {
  const n = current();
  $("app").classList.toggle("detail", !!n);
  if (n) renderDetail(BY[n]); else renderIntro();
  document.querySelectorAll(".row").forEach(r => {
    const on = r.dataset.n === n;
    if (on) { r.setAttribute("aria-current", "true"); if (matchMedia("(min-width:761px)").matches) r.scrollIntoView({ block: "nearest" }); }
    else r.removeAttribute("aria-current");
  });
  if (n && !matchMedia("(min-width:761px)").matches) window.scrollTo(0, 0);
}

function copy(text, btn) {
  const done = ok => { btn.textContent = ok ? "copied" : "failed"; setTimeout(() => (btn.textContent = "copy"), 1200); };
  const fallback = () => {
    const t = document.createElement("textarea");
    t.value = text; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    t.remove(); done(ok);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => done(true), fallback);
  else fallback();
}

$("kinds").innerHTML = KINDS.map(([k, l]) => `<button class="chip" data-k="${k}" aria-pressed="${k === "all"}">${l}</button>`).join("");
$("group").innerHTML = `<option value="all">All groups</option>` + DATA.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join("");
$("kinds").addEventListener("click", ev => {
  const b = ev.target.closest(".chip"); if (!b) return;
  state.kind = b.dataset.k;
  document.querySelectorAll("#kinds .chip").forEach(c => c.setAttribute("aria-pressed", c === b));
  renderList();
});
$("list").addEventListener("click", ev => {
  const g = ev.target.closest(".grp"); if (!g) return;
  folded.has(g.dataset.g) ? folded.delete(g.dataset.g) : folded.add(g.dataset.g);
  saveFolds(); renderList();
});
$("foldAll").addEventListener("click", () => { DATA.groups.forEach(g => folded.add(g.id)); saveFolds(); renderList(); });
$("unfoldAll").addEventListener("click", () => { folded.clear(); saveFolds(); renderList(); });
$("group").addEventListener("change", ev => { state.group = ev.target.value; renderList(); });
$("q").addEventListener("input", ev => { state.q = ev.target.value; renderList(); $("list").scrollTop = 0; });
document.addEventListener("click", ev => { const b = ev.target.closest(".copy"); if (b) copy(b.dataset.copy, b); });
document.addEventListener("keydown", ev => {
  const inSearch = document.activeElement === $("q");
  if (ev.key === "/" && !inSearch) { ev.preventDefault(); $("q").focus(); $("q").select(); return; }
  if (ev.key === "Escape" && inSearch) { $("q").value = ""; state.q = ""; renderList(); return; }
  if (ev.key === "Enter" && inSearch && visible.length) { location.hash = visible[0]; return; }
  if ((ev.key === "ArrowDown" || ev.key === "ArrowUp") && visible.length && !ev.target.matches("select")) {
    ev.preventDefault();
    const i = visible.indexOf(current());
    const j = i < 0 ? 0 : Math.max(0, Math.min(visible.length - 1, i + (ev.key === "ArrowDown" ? 1 : -1)));
    location.hash = visible[j];
  }
});
window.addEventListener("hashchange", route);
renderList();
route();
</script>

</body>
</html>
