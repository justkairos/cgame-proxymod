<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Freestyle Tools Reference</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    --bg: #f4f2ec; --panel: #fbfaf6; --ink: #1d1c19; --muted: #6a675e; --line: #d9d5c8; --code: #ece9df;
    --accent: #b4410e; --accent-ink: #fff; --sel: #efe3d6; --hit: #ffe08a;
    --cvar: #1f5fa8; --button: #b4410e; --command: #5a7a1c;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #151614; --panel: #1c1e1b; --ink: #e9e6dc; --muted: #9a978b; --line: #33362f; --code: #262923;
      --accent: #ff8a4c; --accent-ink: #1a1208; --sel: #33291f; --hit: #6b5200;
      --cvar: #7db4f0; --button: #ff8a4c; --command: #a9cc5c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #151614; --panel: #1c1e1b; --ink: #e9e6dc; --muted: #9a978b; --line: #33362f; --code: #262923;
    --accent: #ff8a4c; --accent-ink: #1a1208; --sel: #33291f; --hit: #6b5200;
    --cvar: #7db4f0; --button: #ff8a4c; --command: #a9cc5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
  .app { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; height: 100vh; height: 100dvh; }
  .side { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel);
    padding-left: env(safe-area-inset-left, 0px); }
  .head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { font: 600 13px/1.2 var(--mono); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 10px; color: var(--muted); }
  h1 b { color: var(--accent); font-weight: 700; }
  input[type=search] { width: 100%; font: 15px var(--mono); padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); }
  input[type=search]:focus, select:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font: 12px var(--mono); padding: 4px 9px; border: 1px solid var(--line); border-radius: 99px; background: transparent;
    color: var(--muted); cursor: pointer; }
  .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  select { font: 12px var(--mono); padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
    color: var(--ink); max-width: 100%; }
  .count { font: 12px var(--mono); color: var(--muted); margin-top: 8px; }
  .list { overflow-y: auto; flex: 1; min-height: 0; padding: 4px 0 24px; }
  .grp { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left;
    font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 16px 6px; }
  .grp:hover { color: var(--ink); }
  .grp::before { content: ""; flex: none; width: 0; height: 0; border: 4px solid transparent; border-top: 6px solid currentColor;
    border-bottom-width: 0; transition: transform .12s; }
  .grp[aria-expanded=false]::before { transform: rotate(-90deg); }
  .grp .c { margin-left: auto; font-weight: 400; letter-spacing: 0; }
  .filters .chip:disabled { opacity: .4; cursor: default; }
  .filters .gap { flex: 1; }
  .row { display: block; padding: 7px 16px; text-decoration: none; color: inherit; border-left: 3px solid transparent; }
  .row:hover { background: var(--code); }
  .row[aria-current=true] { background: var(--sel); border-left-color: var(--accent); }
  .row .n { font: 13.5px var(--mono); overflow-wrap: anywhere; display: flex; gap: 8px; align-items: baseline; }
  .row .s { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dot { flex: none; width: 7px; height: 7px; border-radius: 50%; transform: translateY(-1px); }
  .k-cvar { background: var(--cvar); } .k-button { background: var(--button); } .k-command { background: var(--command); }
  .k-cvarbutton { background: linear-gradient(90deg, var(--cvar) 50%, var(--button) 50%); }
  mark { background: var(--hit); color: inherit; border-radius: 2px; }
  .none { padding: 24px 16px; color: var(--muted); }

  main { overflow-y: auto; min-width: 0; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 80px 32px; }
  .doc { max-width: 780px; }
  .back { display: none; }
  .name { font: 600 24px/1.25 var(--mono); margin: 0; overflow-wrap: anywhere; }
  .lead { font-size: 17px; margin: 8px 0 16px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 20px; padding: 0; list-style: none; }
  .facts li { font: 12.5px var(--mono); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; background: var(--panel); }
  .facts span { color: var(--muted); }
  .badge { color: var(--accent-ink) !important; border-color: transparent !important; }
  .badge.cvar { background: var(--cvar); } .badge.button { background: var(--button); } .badge.command { background: var(--command); }
  :root[data-theme="dark"] .badge, .badge { color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { color: #14140f !important; } }
  :root[data-theme="dark"] .badge { color: #14140f !important; }
  h2 { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 8px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  p { margin: 0 0 10px; overflow-wrap: break-word; }
  main a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: .93em; }
  main a:hover { text-decoration: underline; }
  .cmd { display: flex; align-items: stretch; background: var(--code); border-radius: 6px; margin: 0 0 6px; }
  .cmd code { flex: 1; min-width: 0; font: 13.5px/1.5 var(--mono); padding: 9px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .copy { flex: none; font: 12px var(--mono); border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 0 12px; cursor: pointer; border-radius: 0 6px 6px 0; min-width: 62px; }
  .copy:hover { color: var(--accent); }
  .ex { margin: 0 0 14px; }
  .ex p { margin: 0; color: var(--muted); font-size: 14px; padding-left: 2px; }
  .rel { display: flex; flex-wrap: wrap; gap: 6px; }
  .rel a { border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; background: var(--panel); font-size: 12.5px; }
  details { margin-top: 28px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  summary { cursor: pointer; padding: 9px 12px; font: 12.5px var(--mono); color: var(--muted); }
  details pre { margin: 0; padding: 12px; border-top: 1px solid var(--line); font: 12.5px/1.5 var(--mono); white-space: pre-wrap;
    overflow-wrap: anywhere; }
  .intro table { border-collapse: collapse; margin: 6px 0 14px; font-size: 14px; }
  .intro td { padding: 3px 14px 3px 0; vertical-align: top; }
  .intro td:first-child { font-family: var(--mono); white-space: nowrap; }
  kbd { font: 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }

  @media (max-width: 760px) {
    .app { display: block; height: auto; }
    .side { border-right: 0; min-height: 100vh; padding-right: env(safe-area-inset-right, 0px); }
    .head { position: sticky; top: 0; background: var(--panel); z-index: 2; }
    .list { overflow: visible; }
    main { display: none; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); }
    .app.detail .side { display: none; }
    .app.detail main { display: block; }
    .back { display: inline-block; font: 13px var(--mono); margin-bottom: 14px; padding: 6px 10px; border: 1px solid var(--line);
      border-radius: 6px; background: var(--panel); color: var(--ink) !important; }
    .name { font-size: 19px; }
    .keys { display: none; }
  }
</style>

<div class="app" id="app">
  <div class="side">
    <div class="head">
      <h1><b>kairos'</b> freestyle tools</h1>
      <input type="search" id="q" placeholder="Search cvars, buttons, commands..." autocomplete="off" spellcheck="false" aria-label="Search">
      <div class="filters" id="kinds"></div>
      <div class="filters"><select id="group" aria-label="Group"></select><span class="gap"></span>
        <button class="chip" id="foldAll">Fold all</button><button class="chip" id="unfoldAll">Unfold all</button></div>
      <div class="count" id="count"></div>
    </div>
    <nav class="list" id="list" aria-label="Entries"></nav>
  </div>
  <main id="main"></main>
</div>

<script>
const DATA = {"project":"kairos' freestyle tools","groups":[{"id":"grenade","name":"Grenade tools"},{"id":"rocket","name":"Jump and rocket tools"},{"id":"rjob","name":"Rocket jump overbounce"},{"id":"overbounce","name":"Overbounce and jumping"},{"id":"replay","name":"Input replay"},{"id":"input","name":"Input timing"},{"id":"hud","name":"HUD"},{"id":"trajectory","name":"Player trajectory"}],"entries":[{"name":"mdd_grenade_chase","shown":"mdd_grenade_chase","kind":"cvar+button","group":"grenade","default":"0","added":"2026-10-20","addedNote":null,"usage":["mdd_grenade_chase <0|1>","bind <key> +mdd_grenade_chase"],"summary":"Walks you onto the spot where your grenade will explode.","sections":[["Information","When active after you fire a grenade, the proxymod walks or runs you onto the spot where the grenade will explode, using movement keys only (forward / back / moveleft / moveright, walking when close). It predicts how far you still slide after the keys are released, so it stops within about 2 units of the spot. Your view is not touched; the keys are chosen relative to wherever you are looking.\n\nChase stops once mdd_grenade_jump has jumped, so it doesn't fight you in the air. If the explosion point is next to a wall you may end up pushing into the wall; that is harmless."],["Notes","All grenade tools act on YOUR OWN grenades, tracked from the moment they leave the launcher. The explosion time is the launch time + 50 + 2500 ms, exactly what the server uses. The explosion point is predicted by replaying the server's missile code (bounces, the 0.65 velocity loss, the come-to-rest check) against the world.\n\nEach feature is active while its cvar is 1 OR its +mdd_grenade_<feature> button is held. With several grenades out, mdd_grenade_last picks which one is targeted."]],"examples":[["bind mouse4 +mdd_grenade_chase","Hold mouse4 after firing a grenade to be walked under it."],["mdd_grenade_chase 1","Always chase every grenade you fire."],["bind shift \"+mdd_grenade_chase;+mdd_grenade_aim;+mdd_grenade_jump;+mdd_grenade_shoot\"","One key for the whole grenade jump: walk to it, look at it, jump and fire your weapon right before it blows."]],"related":["mdd_grenade_aim","mdd_grenade_jump","mdd_grenade_shoot","mdd_grenade_last"],"txt":"================================\nCVAR / BUTTON: mdd_grenade_chase\n================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n-----------------------------\nmdd_grenade_chase <0|1>\nbind <key> +mdd_grenade_chase\n-----------------------------\n\n--------------\n1. Information\n--------------\nWalks you onto the spot where your grenade will explode.\n\nWhen active after you fire a grenade, the proxymod walks or runs you onto the spot where the grenade will explode, using movement keys only (forward / back / moveleft / moveright, walking when close). It predicts how far you still slide after the keys are released, so it stops within about 2 units of the spot. Your view is not touched; the keys are chosen relative to wherever you are looking.\n\nChase stops once mdd_grenade_jump has jumped, so it doesn't fight you in the air. If the explosion point is next to a wall you may end up pushing into the wall; that is harmless.\n\nDefault: \"0\"   Added: 2026-10-20\n\n--------\n2. Notes\n--------\nAll grenade tools act on YOUR OWN grenades, tracked from the moment they leave the launcher. The explosion time is the launch time + 50 + 2500 ms, exactly what the server uses. The explosion point is predicted by replaying the server's missile code (bounces, the 0.65 velocity loss, the come-to-rest check) against the world.\n\nEach feature is active while its cvar is 1 OR its +mdd_grenade_<feature> button is held. With several grenades out, mdd_grenade_last picks which one is targeted.\n\n-----------------\n3. Usage examples\n-----------------\nbind mouse4 +mdd_grenade_chase\n    Hold mouse4 after firing a grenade to be walked under it.\n\nmdd_grenade_chase 1\n    Always chase every grenade you fire.\n\nbind shift \"+mdd_grenade_chase;+mdd_grenade_aim;+mdd_grenade_jump;+mdd_grenade_shoot\"\n    One key for the whole grenade jump: walk to it, look at it, jump and fire your weapon right before it blows.\n\n-----------\n4. See also\n-----------\nmdd_grenade_aim, mdd_grenade_jump, mdd_grenade_shoot, mdd_grenade_last\nmdd_help mdd for the overview.\n"},{"name":"mdd_grenade_aim","shown":"mdd_grenade_aim","kind":"cvar+button","group":"grenade","default":"0","added":"2026-10-20","addedNote":null,"usage":["mdd_grenade_aim <0|1>","bind <key> +mdd_grenade_aim"],"summary":"Keeps your view on the predicted explosion point of your grenade.","sections":[["Information","When active after you fire a grenade, the proxymod keeps your view aimed at the predicted explosion point (within about 0.25 degrees). It uses +left / +right / +lookup / +lookdown with cl_yawspeed and cl_pitchspeed set per frame; your original values are restored when it stops. Mouse input still adds on top and is corrected the next frame."],["Notes","All grenade tools act on YOUR OWN grenades, tracked from the moment they leave the launcher. The explosion time is the launch time + 50 + 2500 ms, exactly what the server uses. The explosion point is predicted by replaying the server's missile code (bounces, the 0.65 velocity loss, the come-to-rest check) against the world.\n\nEach feature is active while its cvar is 1 OR its +mdd_grenade_<feature> button is held. With several grenades out, mdd_grenade_last picks which one is targeted."]],"examples":[["bind mouse5 +mdd_grenade_aim","Hold mouse5 to look at where your grenade is going to explode."],["bind shift \"+mdd_grenade_aim;+mdd_grenade_shoot\"","Look at the explosion point and fire a rocket into it at the last moment."]],"related":["mdd_grenade_chase","mdd_grenade_jump","mdd_grenade_shoot"],"txt":"==============================\nCVAR / BUTTON: mdd_grenade_aim\n==============================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n---------------------------\nmdd_grenade_aim <0|1>\nbind <key> +mdd_grenade_aim\n---------------------------\n\n--------------\n1. Information\n--------------\nKeeps your view on the predicted explosion point of your grenade.\n\nWhen active after you fire a grenade, the proxymod keeps your view aimed at the predicted explosion point (within about 0.25 degrees). It uses +left / +right / +lookup / +lookdown with cl_yawspeed and cl_pitchspeed set per frame; your original values are restored when it stops. Mouse input still adds on top and is corrected the next frame.\n\nDefault: \"0\"   Added: 2026-10-20\n\n--------\n2. Notes\n--------\nAll grenade tools act on YOUR OWN grenades, tracked from the moment they leave the launcher. The explosion time is the launch time + 50 + 2500 ms, exactly what the server uses. The explosion point is predicted by replaying the server's missile code (bounces, the 0.65 velocity loss, the come-to-rest check) against the world.\n\nEach feature is active while its cvar is 1 OR its +mdd_grenade_<feature> button is held. With several grenades out, mdd_grenade_last picks which one is targeted.\n\n-----------------\n3. Usage examples\n-----------------\nbind mouse5 +mdd_grenade_aim\n    Hold mouse5 to look at where your grenade is going to explode.\n\nbind shift \"+mdd_grenade_aim;+mdd_grenade_shoot\"\n    Look at the explosion point and fire a rocket into it at the last moment.\n\n-----------\n4. See also\n-----------\nmdd_grenade_chase, mdd_grenade_jump, mdd_grenade_shoot\nmdd_help mdd for the overview.\n"},{"name":"mdd_grenade_jump","shown":"mdd_grenade_jump","kind":"cvar+button","group":"grenade","default":"0","added":"2026-10-20","addedNote":null,"usage":["mdd_grenade_jump <0|1>","bind <key> +mdd_grenade_jump"],"summary":"Jumps in the last usercmd before your grenade explodes.","sections":[["Information","When active, jumps right before your grenade explodes. With mdd_grenade_shoot also active the order is jump, shot, explosion."],["Timing","The usercmd is timed so the SERVER runs it right before the explosion: your ping is subtracted automatically, mdd_grenade_lead (default 8 = one server frame) is subtracted on top, and mdd_grenade_jump_lead (default 24) moves only the jump earlier still. A late jump is lost (the blast has already lifted you), a late shot still fires, which is why the jump gets the extra margin. You can't jump while holding your own jump key."],["Notes","All grenade tools act on YOUR OWN grenades, tracked from the moment they leave the launcher. The explosion time is the launch time + 50 + 2500 ms, exactly what the server uses. The explosion point is predicted by replaying the server's missile code (bounces, the 0.65 velocity loss, the come-to-rest check) against the world.\n\nEach feature is active while its cvar is 1 OR its +mdd_grenade_<feature> button is held. With several grenades out, mdd_grenade_last picks which one is targeted."]],"examples":[["bind space +mdd_grenade_jump","Hold space after firing a grenade at your feet: you jump just before it blows."],["bind shift \"+mdd_grenade_jump;+mdd_grenade_shoot\"","Grenade + rocket jump on one key."],["mdd_grenade_jump_lead 32","Jumps getting lost on a laggy server: jump a little earlier."]],"related":["mdd_grenade_shoot","mdd_grenade_lead","mdd_grenade_jump_lead","mdd_grenade_debug"],"txt":"===============================\nCVAR / BUTTON: mdd_grenade_jump\n===============================\n\n1. Information\n2. Timing\n3. Notes\n4. Usage examples\n5. See also\n\n----------------------------\nmdd_grenade_jump <0|1>\nbind <key> +mdd_grenade_jump\n----------------------------\n\n--------------\n1. Information\n--------------\nJumps in the last usercmd before your grenade explodes.\n\nWhen active, jumps right before your grenade explodes. With mdd_grenade_shoot also active the order is jump, shot, explosion.\n\nDefault: \"0\"   Added: 2026-10-20\n\n---------\n2. Timing\n---------\nThe usercmd is timed so the SERVER runs it right before the explosion: your ping is subtracted automatically, mdd_grenade_lead (default 8 = one server frame) is subtracted on top, and mdd_grenade_jump_lead (default 24) moves only the jump earlier still. A late jump is lost (the blast has already lifted you), a late shot still fires, which is why the jump gets the extra margin. You can't jump while holding your own jump key.\n\n--------\n3. Notes\n--------\nAll grenade tools act on YOUR OWN grenades, tracked from the moment they leave the launcher. The explosion time is the launch time + 50 + 2500 ms, exactly what the server uses. The explosion point is predicted by replaying the server's missile code (bounces, the 0.65 velocity loss, the come-to-rest check) against the world.\n\nEach feature is active while its cvar is 1 OR its +mdd_grenade_<feature> button is held. With several grenades out, mdd_grenade_last picks which one is targeted.\n\n-----------------\n4. Usage examples\n-----------------\nbind space +mdd_grenade_jump\n    Hold space after firing a grenade at your feet: you jump just before it blows.\n\nbind shift \"+mdd_grenade_jump;+mdd_grenade_shoot\"\n    Grenade + rocket jump on one key.\n\nmdd_grenade_jump_lead 32\n    Jumps getting lost on a laggy server: jump a little earlier.\n\n-----------\n5. See also\n-----------\nmdd_grenade_shoot, mdd_grenade_lead, mdd_grenade_jump_lead, mdd_grenade_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_grenade_shoot","shown":"mdd_grenade_shoot","kind":"cvar+button","group":"grenade","default":"0","added":"2026-10-20","addedNote":null,"usage":["mdd_grenade_shoot <0|1>","bind <key> +mdd_grenade_shoot"],"summary":"Fires your current weapon in the last usercmd before your grenade explodes.","sections":[["Information","When active, fires whatever weapon you are holding right before your grenade explodes. With mdd_grenade_jump also active you jump first. Typical use: rocket + grenade jump."],["Timing","Ping is compensated automatically; mdd_grenade_lead (default 8 ms) shifts it earlier. If the weapon is still reloading at the fire time, +attack is held down until it fires (the earliest shot possible); otherwise it is a single tap."],["Notes","All grenade tools act on YOUR OWN grenades, tracked from the moment they leave the launcher. The explosion time is the launch time + 50 + 2500 ms, exactly what the server uses. The explosion point is predicted by replaying the server's missile code (bounces, the 0.65 velocity loss, the come-to-rest check) against the world.\n\nEach feature is active while its cvar is 1 OR its +mdd_grenade_<feature> button is held. With several grenades out, mdd_grenade_last picks which one is targeted."]],"examples":[["bind mouse2 +mdd_grenade_shoot","Fire a grenade, switch to the rocket launcher, aim at your feet and hold mouse2: the rocket goes out as the grenade explodes."],["bind shift \"+mdd_grenade_jump;+mdd_grenade_shoot\"","Jump and shot together on one key."],["mdd_grenade_lead 16","Shot arriving too late: fire one server frame earlier."]],"related":["mdd_grenade_jump","mdd_grenade_lead","mdd_grenade_sync","mdd_grenade_debug"],"txt":"================================\nCVAR / BUTTON: mdd_grenade_shoot\n================================\n\n1. Information\n2. Timing\n3. Notes\n4. Usage examples\n5. See also\n\n-----------------------------\nmdd_grenade_shoot <0|1>\nbind <key> +mdd_grenade_shoot\n-----------------------------\n\n--------------\n1. Information\n--------------\nFires your current weapon in the last usercmd before your grenade explodes.\n\nWhen active, fires whatever weapon you are holding right before your grenade explodes. With mdd_grenade_jump also active you jump first. Typical use: rocket + grenade jump.\n\nDefault: \"0\"   Added: 2026-10-20\n\n---------\n2. Timing\n---------\nPing is compensated automatically; mdd_grenade_lead (default 8 ms) shifts it earlier. If the weapon is still reloading at the fire time, +attack is held down until it fires (the earliest shot possible); otherwise it is a single tap.\n\n--------\n3. Notes\n--------\nAll grenade tools act on YOUR OWN grenades, tracked from the moment they leave the launcher. The explosion time is the launch time + 50 + 2500 ms, exactly what the server uses. The explosion point is predicted by replaying the server's missile code (bounces, the 0.65 velocity loss, the come-to-rest check) against the world.\n\nEach feature is active while its cvar is 1 OR its +mdd_grenade_<feature> button is held. With several grenades out, mdd_grenade_last picks which one is targeted.\n\n-----------------\n4. Usage examples\n-----------------\nbind mouse2 +mdd_grenade_shoot\n    Fire a grenade, switch to the rocket launcher, aim at your feet and hold mouse2: the rocket goes out as the grenade explodes.\n\nbind shift \"+mdd_grenade_jump;+mdd_grenade_shoot\"\n    Jump and shot together on one key.\n\nmdd_grenade_lead 16\n    Shot arriving too late: fire one server frame earlier.\n\n-----------\n5. See also\n-----------\nmdd_grenade_jump, mdd_grenade_lead, mdd_grenade_sync, mdd_grenade_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_grenade_sync","shown":"mdd_grenade_sync","kind":"cvar+button","group":"grenade","default":"0","added":"2026-10-22","addedNote":null,"usage":["mdd_grenade_sync <0|1>","bind <key> +mdd_grenade_sync"],"summary":"One jump + shot timed to your grenade hitting a grenade button.","sections":[["Information","Jump + shot timed to a grenade button. A grenade button is a func_door with health: a grenade that touches it explodes on contact instead of bouncing. Typical use: prefire a grenade at the button, then tap the key (before or after the prefire). You jump just before the first grenade hits the button and your second shot is fired so that it lands at the same moment.\n\nIt is mdd_grenade_jump + mdd_grenade_shoot, except that the explosion time is the predicted contact with the button rather than the 2.5 s fuse, and the shot is timed by its own predicted flight instead of a fixed lead."],["Timing","Jump: mdd_grenade_lead + mdd_grenade_jump_lead ms before the contact, ping compensated.\n\nShot: fired so that it lands mdd_grenade_sync_offset ms (default 0) after the first grenade touches the button. Any weapon works: a second grenade must reach the same button (it only explodes on contact there); a rocket, plasma or bfg shot is timed by its flight to whatever it hits first; hitscan weapons fire right at the moment. If a grenade fired now would not reach the button nothing is fired and it keeps re-checking. If the weapon is still reloading at the fire time, +attack is held until it fires."],["Notes","The key is a latch, not a hold: tapping it arms it, it acts once on the next grenade of yours that will touch a mover, then disarms. The grenade fired by the sync shot is never itself a target. mdd_grenade_sync 1 re-arms by itself once none of your grenades are in the air.\n\nThe proxymod cannot see which movers take damage, so the first mover your grenade touches is taken to be the button. If the grenade bounces off it instead, the prediction is redone from the new trajectory. mdd_grenade_debug 1 prints \"ent N touches mover M\". mdd_grenade_chase and mdd_grenade_aim target the button contact point while sync applies."]],"examples":[["bind mouse4 +mdd_grenade_sync","Fire a grenade at the grenade button, tap mouse4, keep looking at the button: one jump and one more grenade, both blasts together."],["mdd_grenade_sync 1","No key: every grenade you throw at a button gets the sync."],["mdd_grenade_sync_offset 8","Second blast one server frame after the first."]],"related":["mdd_grenade_sync_offset","mdd_grenade_jump","mdd_grenade_shoot","mdd_grenade_debug"],"txt":"===============================\nCVAR / BUTTON: mdd_grenade_sync\n===============================\n\n1. Information\n2. Timing\n3. Notes\n4. Usage examples\n5. See also\n\n----------------------------\nmdd_grenade_sync <0|1>\nbind <key> +mdd_grenade_sync\n----------------------------\n\n--------------\n1. Information\n--------------\nOne jump + shot timed to your grenade hitting a grenade button.\n\nJump + shot timed to a grenade button. A grenade button is a func_door with health: a grenade that touches it explodes on contact instead of bouncing. Typical use: prefire a grenade at the button, then tap the key (before or after the prefire). You jump just before the first grenade hits the button and your second shot is fired so that it lands at the same moment.\n\nIt is mdd_grenade_jump + mdd_grenade_shoot, except that the explosion time is the predicted contact with the button rather than the 2.5 s fuse, and the shot is timed by its own predicted flight instead of a fixed lead.\n\nDefault: \"0\"   Added: 2026-10-22\n\n---------\n2. Timing\n---------\nJump: mdd_grenade_lead + mdd_grenade_jump_lead ms before the contact, ping compensated.\n\nShot: fired so that it lands mdd_grenade_sync_offset ms (default 0) after the first grenade touches the button. Any weapon works: a second grenade must reach the same button (it only explodes on contact there); a rocket, plasma or bfg shot is timed by its flight to whatever it hits first; hitscan weapons fire right at the moment. If a grenade fired now would not reach the button nothing is fired and it keeps re-checking. If the weapon is still reloading at the fire time, +attack is held until it fires.\n\n--------\n3. Notes\n--------\nThe key is a latch, not a hold: tapping it arms it, it acts once on the next grenade of yours that will touch a mover, then disarms. The grenade fired by the sync shot is never itself a target. mdd_grenade_sync 1 re-arms by itself once none of your grenades are in the air.\n\nThe proxymod cannot see which movers take damage, so the first mover your grenade touches is taken to be the button. If the grenade bounces off it instead, the prediction is redone from the new trajectory. mdd_grenade_debug 1 prints \"ent N touches mover M\". mdd_grenade_chase and mdd_grenade_aim target the button contact point while sync applies.\n\n-----------------\n4. Usage examples\n-----------------\nbind mouse4 +mdd_grenade_sync\n    Fire a grenade at the grenade button, tap mouse4, keep looking at the button: one jump and one more grenade, both blasts together.\n\nmdd_grenade_sync 1\n    No key: every grenade you throw at a button gets the sync.\n\nmdd_grenade_sync_offset 8\n    Second blast one server frame after the first.\n\n-----------\n5. See also\n-----------\nmdd_grenade_sync_offset, mdd_grenade_jump, mdd_grenade_shoot, mdd_grenade_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_grenade_sync_offset","shown":"mdd_grenade_sync_offset","kind":"cvar","group":"grenade","default":"0","added":"2026-10-22","addedNote":null,"usage":["mdd_grenade_sync_offset <ms>"],"summary":"How long after the first grenade touches the button the sync shot should land.","sections":[["Information","mdd_grenade_sync: how many ms after the first grenade touches the button the second shot should land. Default 0 (same moment). Negative = second shot first."]],"examples":[["mdd_grenade_sync_offset 0","Both at the same moment (default)."],["mdd_grenade_sync_offset 8","Second shot one server frame later."],["mdd_grenade_sync_offset -8","Second shot one server frame earlier."]],"related":["mdd_grenade_sync"],"txt":"=============================\nCVAR: mdd_grenade_sync_offset\n=============================\n\n1. Information\n2. Usage examples\n3. See also\n\n----------------------------\nmdd_grenade_sync_offset <ms>\n----------------------------\n\n--------------\n1. Information\n--------------\nHow long after the first grenade touches the button the sync shot should land.\n\nmdd_grenade_sync: how many ms after the first grenade touches the button the second shot should land. Default 0 (same moment). Negative = second shot first.\n\nDefault: \"0\"   Added: 2026-10-22\n\n-----------------\n2. Usage examples\n-----------------\nmdd_grenade_sync_offset 0\n    Both at the same moment (default).\n\nmdd_grenade_sync_offset 8\n    Second shot one server frame later.\n\nmdd_grenade_sync_offset -8\n    Second shot one server frame earlier.\n\n-----------\n3. See also\n-----------\nmdd_grenade_sync\nmdd_help mdd for the overview.\n"},{"name":"mdd_grenade_last","shown":"mdd_grenade_last","kind":"cvar","group":"grenade","default":"0","added":"2026-10-20","addedNote":null,"usage":["mdd_grenade_last <0|1>"],"summary":"With several grenades out: target the one that explodes next (0) or last (1).","sections":[["Information","With several of your grenades alive: 0 (default) targets the grenade that explodes NEXT, 1 targets the one that explodes LAST. Affects chase, aim, jump and shoot."]],"examples":[["mdd_grenade_last 1","Fire three grenades, act on the last one."],["bind f \"toggle mdd_grenade_last\"","Flip between next and last with a key."]],"related":["mdd_grenade_chase","mdd_grenade_aim","mdd_grenade_jump","mdd_grenade_shoot"],"txt":"======================\nCVAR: mdd_grenade_last\n======================\n\n1. Information\n2. Usage examples\n3. See also\n\n----------------------\nmdd_grenade_last <0|1>\n----------------------\n\n--------------\n1. Information\n--------------\nWith several grenades out: target the one that explodes next (0) or last (1).\n\nWith several of your grenades alive: 0 (default) targets the grenade that explodes NEXT, 1 targets the one that explodes LAST. Affects chase, aim, jump and shoot.\n\nDefault: \"0\"   Added: 2026-10-20\n\n-----------------\n2. Usage examples\n-----------------\nmdd_grenade_last 1\n    Fire three grenades, act on the last one.\n\nbind f \"toggle mdd_grenade_last\"\n    Flip between next and last with a key.\n\n-----------\n3. See also\n-----------\nmdd_grenade_chase, mdd_grenade_aim, mdd_grenade_jump, mdd_grenade_shoot\nmdd_help mdd for the overview.\n"},{"name":"mdd_grenade_lead","shown":"mdd_grenade_lead","kind":"cvar","group":"grenade","default":"8","added":"2026-10-20","addedNote":null,"usage":["mdd_grenade_lead <ms>"],"summary":"How many ms before the explosion the grenade jump / shot is performed.","sections":[["Information","Perform the grenade jump / shot this many ms earlier than the predicted explosion (default 8 = one server frame at sv_fps 125; negative is allowed). Your ping is already compensated separately, this is the fine adjustment."]],"examples":[["mdd_grenade_lead 8","Default: one server frame before the blast."],["mdd_grenade_lead 16","Shots arriving after the explosion: go one frame earlier."],["mdd_grenade_debug 1","Print the timing of every jump and shot while you tune it."]],"related":["mdd_grenade_jump_lead","mdd_grenade_jump","mdd_grenade_shoot","mdd_grenade_debug"],"txt":"======================\nCVAR: mdd_grenade_lead\n======================\n\n1. Information\n2. Usage examples\n3. See also\n\n---------------------\nmdd_grenade_lead <ms>\n---------------------\n\n--------------\n1. Information\n--------------\nHow many ms before the explosion the grenade jump / shot is performed.\n\nPerform the grenade jump / shot this many ms earlier than the predicted explosion (default 8 = one server frame at sv_fps 125; negative is allowed). Your ping is already compensated separately, this is the fine adjustment.\n\nDefault: \"8\"   Added: 2026-10-20\n\n-----------------\n2. Usage examples\n-----------------\nmdd_grenade_lead 8\n    Default: one server frame before the blast.\n\nmdd_grenade_lead 16\n    Shots arriving after the explosion: go one frame earlier.\n\nmdd_grenade_debug 1\n    Print the timing of every jump and shot while you tune it.\n\n-----------\n3. See also\n-----------\nmdd_grenade_jump_lead, mdd_grenade_jump, mdd_grenade_shoot, mdd_grenade_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_grenade_jump_lead","shown":"mdd_grenade_jump_lead","kind":"cvar","group":"grenade","default":"24","added":"2026-10-20","addedNote":null,"usage":["mdd_grenade_jump_lead <ms>"],"summary":"Extra lead for the grenade jump only.","sections":[["Information","Extra lead for the grenade JUMP only (default 24 ms). A usercmd that reaches the server after the explosion still fires a shot, but a jump is lost because the blast has already lifted you, so the jump is biased early while the shot stays tight. Raise it if jumps get lost on a laggy server."]],"examples":[["mdd_grenade_jump_lead 24","Default."],["mdd_grenade_jump_lead 40","Unstable ping: give the jump more margin."]],"related":["mdd_grenade_lead","mdd_grenade_jump"],"txt":"===========================\nCVAR: mdd_grenade_jump_lead\n===========================\n\n1. Information\n2. Usage examples\n3. See also\n\n--------------------------\nmdd_grenade_jump_lead <ms>\n--------------------------\n\n--------------\n1. Information\n--------------\nExtra lead for the grenade jump only.\n\nExtra lead for the grenade JUMP only (default 24 ms). A usercmd that reaches the server after the explosion still fires a shot, but a jump is lost because the blast has already lifted you, so the jump is biased early while the shot stays tight. Raise it if jumps get lost on a laggy server.\n\nDefault: \"24\"   Added: 2026-10-20\n\n-----------------\n2. Usage examples\n-----------------\nmdd_grenade_jump_lead 24\n    Default.\n\nmdd_grenade_jump_lead 40\n    Unstable ping: give the jump more margin.\n\n-----------\n3. See also\n-----------\nmdd_grenade_lead, mdd_grenade_jump\nmdd_help mdd for the overview.\n"},{"name":"mdd_grenade_debug","shown":"mdd_grenade_debug","kind":"cvar","group":"grenade","default":"0","added":"2026-10-20","addedNote":null,"usage":["mdd_grenade_debug <0|1|2>"],"summary":"Console output for the grenade tools.","sections":[["Information","1: prints when a grenade starts being tracked, which mover it will touch, and when the jump / shot is pressed, with cmd time, explosion time, ping, lead and frame step. Use it to tune mdd_grenade_lead.\n\n2: also prints why a sync shot is being held back."]],"examples":[["mdd_grenade_debug 1","Watch the timing lines while tuning the leads."],["mdd_grenade_debug 2; condump grenade","Capture everything about a sync that didn't fire."]],"related":["mdd_grenade_lead","mdd_grenade_sync"],"txt":"=======================\nCVAR: mdd_grenade_debug\n=======================\n\n1. Information\n2. Usage examples\n3. See also\n\n-------------------------\nmdd_grenade_debug <0|1|2>\n-------------------------\n\n--------------\n1. Information\n--------------\nConsole output for the grenade tools.\n\n1: prints when a grenade starts being tracked, which mover it will touch, and when the jump / shot is pressed, with cmd time, explosion time, ping, lead and frame step. Use it to tune mdd_grenade_lead.\n\n2: also prints why a sync shot is being held back.\n\nDefault: \"0\"   Added: 2026-10-20\n\n-----------------\n2. Usage examples\n-----------------\nmdd_grenade_debug 1\n    Watch the timing lines while tuning the leads.\n\nmdd_grenade_debug 2; condump grenade\n    Capture everything about a sync that didn't fire.\n\n-----------\n3. See also\n-----------\nmdd_grenade_lead, mdd_grenade_sync\nmdd_help mdd for the overview.\n"},{"name":"mdd_jumpshoot","shown":"+mdd_jumpshoot","kind":"button","group":"rocket","default":null,"added":"2026-10-20","addedNote":null,"usage":["bind <key> +mdd_jumpshoot"],"summary":"Jump and fire as soon as you are on the ground with the weapon ready; fires off jump pads too.","sections":[["Information","While held: as soon as you are on the ground and your weapon is ready, it jumps and fires - what bind x \"+moveup;+attack\" does, but it waits for the ground and the reload for you and spreads the key events like a human. Rocket jumps, plasma hops, P-overbounces. It re-arms every time you land again while the key stays held, so holding it chains plasma hops. If the jump doesn't take (e.g. you are holding your own jump key) it retries after 150 ms."],["Timing","The four key events go out as +moveup, then +attack a random mdd_input_stagger_min..max ms later, then -moveup, then -attack a random stagger after it. The holds are random too and no pattern repeats within the last 256 jump-shots. No two automated key events are ever in the same usercmd. mdd_jumpshoot_debug 1 prints the rolled gaps and the real usercmd times of all four events."],["Jump pads","When you are about to hit a pad that sends you up, it fires without a jump. It predicts when you enter the pad and when a rocket fired now would hit next to it, and fires so the rocket impact lands mdd_jumpshoot_pad_delay ms relative to the touch (negative = before it). Both times come from your real velocity against the real trigger brush, so the value carries over between pads and approach speeds. If no such shot is possible (not looking at the pad) it fires in the usercmd right after the launch. mdd_rocket_debug 1 prints the peak upward speed after every pad launch."],["Notes","This is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs."]],"examples":[["bind mouse2 +mdd_jumpshoot","Hold mouse2 with the rocket launcher, looking down: a rocket jump the moment you can."],["bind mouse2 +mdd_jumpshoot","Hold it with the plasma gun against a wall to chain plasma hops."],["mdd_jumpshoot_pad_delay -8","Falling onto a jump pad: have the rocket land one usercmd before you touch it."],["mdd_jumpshoot_debug 1","Check the randomized key timing of every jump-shot."]],"related":["mdd_jumpshoot_pad_delay","mdd_jumpshoot_debug","mdd_input_stagger_min","mdd_rocketjump_overbounce"],"txt":"======================\nBUTTON: +mdd_jumpshoot\n======================\n\n1. Information\n2. Timing\n3. Jump pads\n4. Notes\n5. Usage examples\n6. See also\n\n-------------------------\nbind <key> +mdd_jumpshoot\n-------------------------\n\n--------------\n1. Information\n--------------\nJump and fire as soon as you are on the ground with the weapon ready; fires off jump pads too.\n\nWhile held: as soon as you are on the ground and your weapon is ready, it jumps and fires - what bind x \"+moveup;+attack\" does, but it waits for the ground and the reload for you and spreads the key events like a human. Rocket jumps, plasma hops, P-overbounces. It re-arms every time you land again while the key stays held, so holding it chains plasma hops. If the jump doesn't take (e.g. you are holding your own jump key) it retries after 150 ms.\n\nAdded: 2026-10-20\n\n---------\n2. Timing\n---------\nThe four key events go out as +moveup, then +attack a random mdd_input_stagger_min..max ms later, then -moveup, then -attack a random stagger after it. The holds are random too and no pattern repeats within the last 256 jump-shots. No two automated key events are ever in the same usercmd. mdd_jumpshoot_debug 1 prints the rolled gaps and the real usercmd times of all four events.\n\n------------\n3. Jump pads\n------------\nWhen you are about to hit a pad that sends you up, it fires without a jump. It predicts when you enter the pad and when a rocket fired now would hit next to it, and fires so the rocket impact lands mdd_jumpshoot_pad_delay ms relative to the touch (negative = before it). Both times come from your real velocity against the real trigger brush, so the value carries over between pads and approach speeds. If no such shot is possible (not looking at the pad) it fires in the usercmd right after the launch. mdd_rocket_debug 1 prints the peak upward speed after every pad launch.\n\n--------\n4. Notes\n--------\nThis is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs.\n\n-----------------\n5. Usage examples\n-----------------\nbind mouse2 +mdd_jumpshoot\n    Hold mouse2 with the rocket launcher, looking down: a rocket jump the moment you can.\n\nbind mouse2 +mdd_jumpshoot\n    Hold it with the plasma gun against a wall to chain plasma hops.\n\nmdd_jumpshoot_pad_delay -8\n    Falling onto a jump pad: have the rocket land one usercmd before you touch it.\n\nmdd_jumpshoot_debug 1\n    Check the randomized key timing of every jump-shot.\n\n-----------\n6. See also\n-----------\nmdd_jumpshoot_pad_delay, mdd_jumpshoot_debug, mdd_input_stagger_min, +mdd_rocketjump_overbounce\nmdd_help mdd for the overview.\n"},{"name":"mdd_jumpshoot_pad_delay","shown":"mdd_jumpshoot_pad_delay","kind":"cvar","group":"rocket","default":"8","added":"2026-10-22","addedNote":null,"usage":["mdd_jumpshoot_pad_delay <ms>"],"summary":"Where the rocket impact should land relative to touching a jump pad.","sections":[["Information","+mdd_jumpshoot on jump pads: the rocket impact is timed to land this many ms after the predicted touch of the pad's trigger; negative values put it before the touch. The touch time (your box against the trigger brush, with your real velocity and gravity) and the rocket's flight are both predicted every frame, so one value works across pads and approach speeds. Timing is in 8 ms usercmd steps."],["Notes","-8 has given the best height in testing. mdd_rocket_debug 1 prints \"peak upward speed after the pad launch\" so you can compare values."]],"examples":[["mdd_jumpshoot_pad_delay -8","Rocket lands one usercmd before the touch (best height so far)."],["mdd_jumpshoot_pad_delay 8","Default: one usercmd after the touch."],["mdd_rocket_debug 1","Print the peak upward speed after each pad launch to compare settings."]],"related":["mdd_jumpshoot","mdd_rocket_debug"],"txt":"=============================\nCVAR: mdd_jumpshoot_pad_delay\n=============================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n----------------------------\nmdd_jumpshoot_pad_delay <ms>\n----------------------------\n\n--------------\n1. Information\n--------------\nWhere the rocket impact should land relative to touching a jump pad.\n\n+mdd_jumpshoot on jump pads: the rocket impact is timed to land this many ms after the predicted touch of the pad's trigger; negative values put it before the touch. The touch time (your box against the trigger brush, with your real velocity and gravity) and the rocket's flight are both predicted every frame, so one value works across pads and approach speeds. Timing is in 8 ms usercmd steps.\n\nDefault: \"8\"   Added: 2026-10-22\n\n--------\n2. Notes\n--------\n-8 has given the best height in testing. mdd_rocket_debug 1 prints \"peak upward speed after the pad launch\" so you can compare values.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_jumpshoot_pad_delay -8\n    Rocket lands one usercmd before the touch (best height so far).\n\nmdd_jumpshoot_pad_delay 8\n    Default: one usercmd after the touch.\n\nmdd_rocket_debug 1\n    Print the peak upward speed after each pad launch to compare settings.\n\n-----------\n4. See also\n-----------\n+mdd_jumpshoot, mdd_rocket_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_jumpshoot_debug","shown":"mdd_jumpshoot_debug","kind":"cvar","group":"rocket","default":"0","added":"2026-10-23","addedNote":null,"usage":["mdd_jumpshoot_debug <0|1>"],"summary":"Prints the real key timing of every ground jump-shot.","sections":[["Information","+mdd_jumpshoot ground jump-shots: prints the gap that was rolled and, once both keys are back up, what was actually sent: the usercmd times of +moveup, +attack, -moveup, -attack, how long each key was held, the gap between the two presses and the gap between the two releases. Use it to confirm the stagger and randomization for a demo. Pad shots are reported by mdd_rocket_debug."]],"examples":[["mdd_jumpshoot_debug 1","Hold +mdd_jumpshoot for a while and read the [input] lines."],["mdd_input_stagger_min 8; mdd_input_stagger_max 16; mdd_jumpshoot_debug 1","Narrow the stagger and confirm the holds really stay within one or two usercmds."]],"related":["mdd_jumpshoot","mdd_input_debug","mdd_input_stagger_min"],"txt":"=========================\nCVAR: mdd_jumpshoot_debug\n=========================\n\n1. Information\n2. Usage examples\n3. See also\n\n-------------------------\nmdd_jumpshoot_debug <0|1>\n-------------------------\n\n--------------\n1. Information\n--------------\nPrints the real key timing of every ground jump-shot.\n\n+mdd_jumpshoot ground jump-shots: prints the gap that was rolled and, once both keys are back up, what was actually sent: the usercmd times of +moveup, +attack, -moveup, -attack, how long each key was held, the gap between the two presses and the gap between the two releases. Use it to confirm the stagger and randomization for a demo. Pad shots are reported by mdd_rocket_debug.\n\nDefault: \"0\"   Added: 2026-10-23\n\n-----------------\n2. Usage examples\n-----------------\nmdd_jumpshoot_debug 1\n    Hold +mdd_jumpshoot for a while and read the [input] lines.\n\nmdd_input_stagger_min 8; mdd_input_stagger_max 16; mdd_jumpshoot_debug 1\n    Narrow the stagger and confirm the holds really stay within one or two usercmds.\n\n-----------\n3. See also\n-----------\n+mdd_jumpshoot, mdd_input_debug, mdd_input_stagger_min\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketsync","shown":"+mdd_rocketsync","kind":"button","group":"rocket","default":null,"added":"2026-10-20","addedNote":null,"usage":["bind <key> +mdd_rocketsync"],"summary":"Jump + shot timed to your next rocket hitting the world.","sections":[["Information","While held: times a jump + shot so the shot is the last usercmd before YOUR NEXT ROCKET hits the world (floor or wall), with the jump before it. Same timing model as the grenade tools: ping compensated, mdd_rocketsync_lead (default 8) and mdd_rocketsync_jump_lead (default 24).\n\nTypical use: prefire rockets down a drop, land, hold this: you jump and fire right as they hit."],["Notes","This is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs."]],"examples":[["bind mouse4 +mdd_rocketsync","Prefire a rocket down a shaft, fall after it, hold mouse4 before landing."],["bind shift \"+mdd_rocketstack;+mdd_rocketsync\"","Stack a rocket on the way down and sync the jump + shot at the bottom with one key."],["mdd_rocketsync_jump_lead 32","Jump getting lost: give it more lead."]],"related":["mdd_rocketsync_lead","mdd_rocketsync_jump_lead","mdd_rocketstack","mdd_rocket_debug"],"txt":"=======================\nBUTTON: +mdd_rocketsync\n=======================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n--------------------------\nbind <key> +mdd_rocketsync\n--------------------------\n\n--------------\n1. Information\n--------------\nJump + shot timed to your next rocket hitting the world.\n\nWhile held: times a jump + shot so the shot is the last usercmd before YOUR NEXT ROCKET hits the world (floor or wall), with the jump before it. Same timing model as the grenade tools: ping compensated, mdd_rocketsync_lead (default 8) and mdd_rocketsync_jump_lead (default 24).\n\nTypical use: prefire rockets down a drop, land, hold this: you jump and fire right as they hit.\n\nAdded: 2026-10-20\n\n--------\n2. Notes\n--------\nThis is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs.\n\n-----------------\n3. Usage examples\n-----------------\nbind mouse4 +mdd_rocketsync\n    Prefire a rocket down a shaft, fall after it, hold mouse4 before landing.\n\nbind shift \"+mdd_rocketstack;+mdd_rocketsync\"\n    Stack a rocket on the way down and sync the jump + shot at the bottom with one key.\n\nmdd_rocketsync_jump_lead 32\n    Jump getting lost: give it more lead.\n\n-----------\n4. See also\n-----------\nmdd_rocketsync_lead, mdd_rocketsync_jump_lead, +mdd_rocketstack, mdd_rocket_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketsync_lead","shown":"mdd_rocketsync_lead","kind":"cvar","group":"rocket","default":"8","added":"2026-10-20","addedNote":null,"usage":["mdd_rocketsync_lead <ms>"],"summary":"How many ms before the rocket impact the sync shot is fired.","sections":[["Information","Perform the +mdd_rocketsync shot this many ms before the rocket impact (default 8). Ping is compensated separately."]],"examples":[["mdd_rocketsync_lead 8","Default."],["mdd_rocketsync_lead 16","Shot arriving late: one frame earlier."]],"related":["mdd_rocketsync","mdd_rocketsync_jump_lead"],"txt":"=========================\nCVAR: mdd_rocketsync_lead\n=========================\n\n1. Information\n2. Usage examples\n3. See also\n\n------------------------\nmdd_rocketsync_lead <ms>\n------------------------\n\n--------------\n1. Information\n--------------\nHow many ms before the rocket impact the sync shot is fired.\n\nPerform the +mdd_rocketsync shot this many ms before the rocket impact (default 8). Ping is compensated separately.\n\nDefault: \"8\"   Added: 2026-10-20\n\n-----------------\n2. Usage examples\n-----------------\nmdd_rocketsync_lead 8\n    Default.\n\nmdd_rocketsync_lead 16\n    Shot arriving late: one frame earlier.\n\n-----------\n3. See also\n-----------\n+mdd_rocketsync, mdd_rocketsync_jump_lead\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketsync_jump_lead","shown":"mdd_rocketsync_jump_lead","kind":"cvar","group":"rocket","default":"24","added":"2026-10-20","addedNote":null,"usage":["mdd_rocketsync_jump_lead <ms>"],"summary":"Extra lead for the rocket-sync jump only.","sections":[["Information","Extra lead for the +mdd_rocketsync JUMP only (default 24), same reasoning as mdd_grenade_jump_lead: a late jump is lost, a late shot still fires."]],"examples":[["mdd_rocketsync_jump_lead 24","Default."],["mdd_rocketsync_jump_lead 40","More margin on a laggy server."]],"related":["mdd_rocketsync","mdd_rocketsync_lead"],"txt":"==============================\nCVAR: mdd_rocketsync_jump_lead\n==============================\n\n1. Information\n2. Usage examples\n3. See also\n\n-----------------------------\nmdd_rocketsync_jump_lead <ms>\n-----------------------------\n\n--------------\n1. Information\n--------------\nExtra lead for the rocket-sync jump only.\n\nExtra lead for the +mdd_rocketsync JUMP only (default 24), same reasoning as mdd_grenade_jump_lead: a late jump is lost, a late shot still fires.\n\nDefault: \"24\"   Added: 2026-10-20\n\n-----------------\n2. Usage examples\n-----------------\nmdd_rocketsync_jump_lead 24\n    Default.\n\nmdd_rocketsync_jump_lead 40\n    More margin on a laggy server.\n\n-----------\n3. See also\n-----------\n+mdd_rocketsync, mdd_rocketsync_lead\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketstack","shown":"+mdd_rocketstack","kind":"button","group":"rocket","default":null,"added":"2026-10-20","addedNote":null,"usage":["bind <key> +mdd_rocketstack"],"summary":"Fires a rocket at the moment it would explode together with one already in flight.","sections":[["Information","While held, with the rocket launcher out and one of your rockets still in flight: every frame the proxymod predicts where and when a rocket fired RIGHT NOW would hit, and fires at the moment that impact time equals the existing rocket's impact time, so both explode together. On a fall that moment is when you pass the rocket. If you are slower than the rocket (900 ups) the moment never comes and nothing happens."],["Tuning","mdd_rocketstack_offset (ms, default 0) shifts the moment; mdd_rocket_debug 1 prints the numbers."],["Notes","This is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs."]],"examples":[["bind mouse5 +mdd_rocketstack","Prefire two rockets down a drop, fall past them with mouse5 held: a third is stacked onto the first one you reach."],["bind shift \"+mdd_rocketstack;+mdd_rocketsync\"","Stack on the way down, then jump + shoot as they land."]],"related":["mdd_rocketstack_offset","mdd_rocketsync","mdd_rocket_debug"],"txt":"========================\nBUTTON: +mdd_rocketstack\n========================\n\n1. Information\n2. Tuning\n3. Notes\n4. Usage examples\n5. See also\n\n---------------------------\nbind <key> +mdd_rocketstack\n---------------------------\n\n--------------\n1. Information\n--------------\nFires a rocket at the moment it would explode together with one already in flight.\n\nWhile held, with the rocket launcher out and one of your rockets still in flight: every frame the proxymod predicts where and when a rocket fired RIGHT NOW would hit, and fires at the moment that impact time equals the existing rocket's impact time, so both explode together. On a fall that moment is when you pass the rocket. If you are slower than the rocket (900 ups) the moment never comes and nothing happens.\n\nAdded: 2026-10-20\n\n---------\n2. Tuning\n---------\nmdd_rocketstack_offset (ms, default 0) shifts the moment; mdd_rocket_debug 1 prints the numbers.\n\n--------\n3. Notes\n--------\nThis is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs.\n\n-----------------\n4. Usage examples\n-----------------\nbind mouse5 +mdd_rocketstack\n    Prefire two rockets down a drop, fall past them with mouse5 held: a third is stacked onto the first one you reach.\n\nbind shift \"+mdd_rocketstack;+mdd_rocketsync\"\n    Stack on the way down, then jump + shoot as they land.\n\n-----------\n5. See also\n-----------\nmdd_rocketstack_offset, +mdd_rocketsync, mdd_rocket_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketstack_offset","shown":"mdd_rocketstack_offset","kind":"cvar","group":"rocket","default":"0","added":"2026-10-20","addedNote":null,"usage":["mdd_rocketstack_offset <ms>"],"summary":"Shifts the rocket-stack firing moment.","sections":[["Information","Shift the +mdd_rocketstack firing moment (default 0; positive fires later)."]],"examples":[["mdd_rocketstack_offset 0","Default: impacts at the same time."],["mdd_rocketstack_offset 8","Stacked rocket one usercmd later."]],"related":["mdd_rocketstack"],"txt":"============================\nCVAR: mdd_rocketstack_offset\n============================\n\n1. Information\n2. Usage examples\n3. See also\n\n---------------------------\nmdd_rocketstack_offset <ms>\n---------------------------\n\n--------------\n1. Information\n--------------\nShifts the rocket-stack firing moment.\n\nShift the +mdd_rocketstack firing moment (default 0; positive fires later).\n\nDefault: \"0\"   Added: 2026-10-20\n\n-----------------\n2. Usage examples\n-----------------\nmdd_rocketstack_offset 0\n    Default: impacts at the same time.\n\nmdd_rocketstack_offset 8\n    Stacked rocket one usercmd later.\n\n-----------\n3. See also\n-----------\n+mdd_rocketstack\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocket_debug","shown":"mdd_rocket_debug","kind":"cvar","group":"rocket","default":"0","added":"2026-10-20","addedNote":null,"usage":["mdd_rocket_debug <0|1|2>"],"summary":"Console output for jumpshoot, rocketsync and rocketstack.","sections":[["Information","1: timing output for +mdd_jumpshoot, +mdd_rocketsync and +mdd_rocketstack: rocket tracking, impact times, when keys were pressed, and the peak upward speed after every jump-pad launch.\n\n2: also dumps the jump-pad entity that was touched."]],"examples":[["mdd_rocket_debug 1","Compare peak upward speed between mdd_jumpshoot_pad_delay values."],["mdd_rocket_debug 1","See when +mdd_rocketsync pressed jump and attack against the impact time."]],"related":["mdd_jumpshoot","mdd_rocketsync","mdd_rocketstack","mdd_jumpshoot_pad_delay"],"txt":"======================\nCVAR: mdd_rocket_debug\n======================\n\n1. Information\n2. Usage examples\n3. See also\n\n------------------------\nmdd_rocket_debug <0|1|2>\n------------------------\n\n--------------\n1. Information\n--------------\nConsole output for jumpshoot, rocketsync and rocketstack.\n\n1: timing output for +mdd_jumpshoot, +mdd_rocketsync and +mdd_rocketstack: rocket tracking, impact times, when keys were pressed, and the peak upward speed after every jump-pad launch.\n\n2: also dumps the jump-pad entity that was touched.\n\nDefault: \"0\"   Added: 2026-10-20\n\n-----------------\n2. Usage examples\n-----------------\nmdd_rocket_debug 1\n    Compare peak upward speed between mdd_jumpshoot_pad_delay values.\n\nmdd_rocket_debug 1\n    See when +mdd_rocketsync pressed jump and attack against the impact time.\n\n-----------\n3. See also\n-----------\n+mdd_jumpshoot, +mdd_rocketsync, +mdd_rocketstack, mdd_jumpshoot_pad_delay\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketjump_overbounce","shown":"+mdd_rocketjump_overbounce","kind":"button","group":"rjob","default":null,"added":"2026-11-10","addedNote":null,"usage":["bind <key> +mdd_rocketjump_overbounce"],"summary":"One rocket jump at your current view, chosen so that you land on an overbounce.","sections":[["Information","One rocket jump per key press, aimed where you are looking, chosen so that you land on an overbounce. Be on the ground with the rocket launcher ready and press the key. Jump and shot go through the usual randomized input layer.\n\nYou don't have to stand still: the jump can only go out a few frames after the key press, so the plan is made for where you will be by then (sliding to a stop or running on flat ground is carried forward pmove by pmove) and checked against where you really are in the frame the jump is sent. If that check fails it plans again, up to three times."],["How it chooses","At a fixed view the only free choice is how many pmove slots lie between the jump and the shot. Each one gives one knockback and therefore one landing, and only about one landing in twenty ends inside the 0.25 unit ground trace, so on its own an overbounce exists about a third of the time. The pitch may therefore also be nudged by up to mdd_rocketjump_overbounce_nudge degrees right before the shot; it is turned back afterwards.\n\nEvery candidate is simulated against the real map the way the server runs it: jump, muzzle point, 50 ms prestep, rocket impact, splash knockback (whole points only), velocity snapped every pmove, free fall until the landing. Of all candidates that overbounce, the highest one is used, typically 10-15 units below the best plain rocket jump. If none overbounces, the best plain rocket jump at your exact view is done and a line says so.\n\nAiming straight down (the engine stops the view at 87.89 degrees) is the hardest case: the view can only be tilted one way and the blast stays under your feet where the knockback barely changes. Use mdd_rocketjump_overbounce_nudge 4 there."],["Debug","With mdd_rocketjump_overbounce_debug 1 every use prints the chosen candidate and checks it against the server: how many pmoves after the jump the shot went out, which usercmd the blast followed, the blast point and knockback, the velocity after the blast (MATCH / MISMATCH) and the landing, ending in one RESULT line. The same plus full detail is appended to rjob.log in the mod folder."],["Limits","VQ3 physics, com_maxfps 125, pmove_fixed 1 / pmove_msec 8 (or g_synchronousClients 1). The jump is held back a frame or two until the shot can go out with a usercmd that ends exactly on the planned slot.\n\nThe blast timing is certain when the rocket lands within 45 units of the muzzle (roughly pitch 65 and steeper with a short delay); those candidates are preferred. Shallower shots are marked \"timing depends on the frame phase\" and can miss more often.\n\nDon't move the mouse between the key press and the shot, and don't steer onto ground of a different height during the flight. Only normal overbounces are targeted, not sticky ones. Movers are not simulated. Online the server timing can shift by a usercmd, which misses."]],"examples":[["bind mouse4 +mdd_rocketjump_overbounce","Look at the floor in front of you with the rocket launcher, tap mouse4."],["mdd_rocketjump_overbounce_nudge 4","Aiming straight down: allow a bigger view correction."],["mdd_rocketjump_overbounce_nudge 0","Never touch the view: only the jump-to-shot delay is varied."],["bind mouse4 \"+mdd_rocketjump_overbounce\"; bind space +mdd_overbounce_jump","Land the overbounce, then hold space to jump out of it on the first possible usercmd."],["mdd_rocketjump_overbounce_debug 1","See the RESULT line and write rjob.log."]],"related":["mdd_rocketjump_overbounce_nudge","mdd_rocketjump_overbounce_delay_max","mdd_rocketjump_overbounce_explode_offset","mdd_rocketjump_overbounce_debug","mdd_overbounce_jump"],"txt":"==================================\nBUTTON: +mdd_rocketjump_overbounce\n==================================\n\n1. Information\n2. How it chooses\n3. Debug\n4. Limits\n5. Usage examples\n6. See also\n\n-------------------------------------\nbind <key> +mdd_rocketjump_overbounce\n-------------------------------------\n\n--------------\n1. Information\n--------------\nOne rocket jump at your current view, chosen so that you land on an overbounce.\n\nOne rocket jump per key press, aimed where you are looking, chosen so that you land on an overbounce. Be on the ground with the rocket launcher ready and press the key. Jump and shot go through the usual randomized input layer.\n\nYou don't have to stand still: the jump can only go out a few frames after the key press, so the plan is made for where you will be by then (sliding to a stop or running on flat ground is carried forward pmove by pmove) and checked against where you really are in the frame the jump is sent. If that check fails it plans again, up to three times.\n\nAdded: 2026-11-10\n\n-----------------\n2. How it chooses\n-----------------\nAt a fixed view the only free choice is how many pmove slots lie between the jump and the shot. Each one gives one knockback and therefore one landing, and only about one landing in twenty ends inside the 0.25 unit ground trace, so on its own an overbounce exists about a third of the time. The pitch may therefore also be nudged by up to mdd_rocketjump_overbounce_nudge degrees right before the shot; it is turned back afterwards.\n\nEvery candidate is simulated against the real map the way the server runs it: jump, muzzle point, 50 ms prestep, rocket impact, splash knockback (whole points only), velocity snapped every pmove, free fall until the landing. Of all candidates that overbounce, the highest one is used, typically 10-15 units below the best plain rocket jump. If none overbounces, the best plain rocket jump at your exact view is done and a line says so.\n\nAiming straight down (the engine stops the view at 87.89 degrees) is the hardest case: the view can only be tilted one way and the blast stays under your feet where the knockback barely changes. Use mdd_rocketjump_overbounce_nudge 4 there.\n\n--------\n3. Debug\n--------\nWith mdd_rocketjump_overbounce_debug 1 every use prints the chosen candidate and checks it against the server: how many pmoves after the jump the shot went out, which usercmd the blast followed, the blast point and knockback, the velocity after the blast (MATCH / MISMATCH) and the landing, ending in one RESULT line. The same plus full detail is appended to rjob.log in the mod folder.\n\n---------\n4. Limits\n---------\nVQ3 physics, com_maxfps 125, pmove_fixed 1 / pmove_msec 8 (or g_synchronousClients 1). The jump is held back a frame or two until the shot can go out with a usercmd that ends exactly on the planned slot.\n\nThe blast timing is certain when the rocket lands within 45 units of the muzzle (roughly pitch 65 and steeper with a short delay); those candidates are preferred. Shallower shots are marked \"timing depends on the frame phase\" and can miss more often.\n\nDon't move the mouse between the key press and the shot, and don't steer onto ground of a different height during the flight. Only normal overbounces are targeted, not sticky ones. Movers are not simulated. Online the server timing can shift by a usercmd, which misses.\n\n-----------------\n5. Usage examples\n-----------------\nbind mouse4 +mdd_rocketjump_overbounce\n    Look at the floor in front of you with the rocket launcher, tap mouse4.\n\nmdd_rocketjump_overbounce_nudge 4\n    Aiming straight down: allow a bigger view correction.\n\nmdd_rocketjump_overbounce_nudge 0\n    Never touch the view: only the jump-to-shot delay is varied.\n\nbind mouse4 \"+mdd_rocketjump_overbounce\"; bind space +mdd_overbounce_jump\n    Land the overbounce, then hold space to jump out of it on the first possible usercmd.\n\nmdd_rocketjump_overbounce_debug 1\n    See the RESULT line and write rjob.log.\n\n-----------\n6. See also\n-----------\nmdd_rocketjump_overbounce_nudge, mdd_rocketjump_overbounce_delay_max, mdd_rocketjump_overbounce_explode_offset, mdd_rocketjump_overbounce_debug, +mdd_overbounce_jump\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketjump_overbounce_nudge","shown":"mdd_rocketjump_overbounce_nudge","kind":"cvar","group":"rjob","default":"2","added":"2026-11-10","addedNote":null,"usage":["mdd_rocketjump_overbounce_nudge <degrees>"],"summary":"Largest pitch change allowed right before the shot.","sections":[["Information","+mdd_rocketjump_overbounce: the largest pitch change it may make right before the shot to reach an overbounce; the view is turned back afterwards. Default 2. 0 = never touch the view (an overbounce is then reachable only about a third of the time). Aiming straight down needs more: 4 is a good value there."],["Notes","Part of +mdd_rocketjump_overbounce; see that entry for the whole feature."]],"examples":[["mdd_rocketjump_overbounce_nudge 2","Default: an overbounce is found on most presses at normal angles."],["mdd_rocketjump_overbounce_nudge 4","For straight-down rocket jumps."],["mdd_rocketjump_overbounce_nudge 0","Exact view only."]],"related":["mdd_rocketjump_overbounce","mdd_rocketjump_overbounce_delay_max"],"txt":"=====================================\nCVAR: mdd_rocketjump_overbounce_nudge\n=====================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n-----------------------------------------\nmdd_rocketjump_overbounce_nudge <degrees>\n-----------------------------------------\n\n--------------\n1. Information\n--------------\nLargest pitch change allowed right before the shot.\n\n+mdd_rocketjump_overbounce: the largest pitch change it may make right before the shot to reach an overbounce; the view is turned back afterwards. Default 2. 0 = never touch the view (an overbounce is then reachable only about a third of the time). Aiming straight down needs more: 4 is a good value there.\n\nDefault: \"2\"   Added: 2026-11-10\n\n--------\n2. Notes\n--------\nPart of +mdd_rocketjump_overbounce; see that entry for the whole feature.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_rocketjump_overbounce_nudge 2\n    Default: an overbounce is found on most presses at normal angles.\n\nmdd_rocketjump_overbounce_nudge 4\n    For straight-down rocket jumps.\n\nmdd_rocketjump_overbounce_nudge 0\n    Exact view only.\n\n-----------\n4. See also\n-----------\n+mdd_rocketjump_overbounce, mdd_rocketjump_overbounce_delay_max\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketjump_overbounce_delay_max","shown":"mdd_rocketjump_overbounce_delay_max","kind":"cvar","group":"rjob","default":"6","added":"2026-11-10","addedNote":null,"usage":["mdd_rocketjump_overbounce_delay_max <1..12>"],"summary":"Longest jump-to-shot delay tried, in pmove slots.","sections":[["Information","+mdd_rocketjump_overbounce: the longest jump-to-shot delay tried, in pmove slots (8 ms each). Default 6. Longer delays give more candidates but lower jumps."],["Notes","Part of +mdd_rocketjump_overbounce; see that entry for the whole feature."]],"examples":[["mdd_rocketjump_overbounce_delay_max 6","Default."],["mdd_rocketjump_overbounce_delay_max 12","More candidates when nothing is reachable, at the cost of height."]],"related":["mdd_rocketjump_overbounce","mdd_rocketjump_overbounce_nudge"],"txt":"=========================================\nCVAR: mdd_rocketjump_overbounce_delay_max\n=========================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n-------------------------------------------\nmdd_rocketjump_overbounce_delay_max <1..12>\n-------------------------------------------\n\n--------------\n1. Information\n--------------\nLongest jump-to-shot delay tried, in pmove slots.\n\n+mdd_rocketjump_overbounce: the longest jump-to-shot delay tried, in pmove slots (8 ms each). Default 6. Longer delays give more candidates but lower jumps.\n\nDefault: \"6\"   Added: 2026-11-10\n\n--------\n2. Notes\n--------\nPart of +mdd_rocketjump_overbounce; see that entry for the whole feature.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_rocketjump_overbounce_delay_max 6\n    Default.\n\nmdd_rocketjump_overbounce_delay_max 12\n    More candidates when nothing is reachable, at the cost of height.\n\n-----------\n4. See also\n-----------\n+mdd_rocketjump_overbounce, mdd_rocketjump_overbounce_nudge\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketjump_overbounce_explode_offset","shown":"mdd_rocketjump_overbounce_explode_offset","kind":"cvar","group":"rjob","default":"0","added":"2026-11-10","addedNote":null,"usage":["mdd_rocketjump_overbounce_explode_offset <usercmds>"],"summary":"Calibration: shifts which usercmd the blast is assumed to follow for far-landing rockets.","sections":[["Information","+mdd_rocketjump_overbounce: shifts which of your usercmds the blast is assumed to follow when the rocket lands beyond its first step. Default 0. Only for calibration: leave it alone unless the debug output shows \"blast seen after cmd N (planned M)\" consistently one off in the same direction."],["Notes","Part of +mdd_rocketjump_overbounce; see that entry for the whole feature."]],"examples":[["mdd_rocketjump_overbounce_explode_offset 0","Default."],["mdd_rocketjump_overbounce_explode_offset 1","Debug shows the blast always one usercmd later than planned."],["mdd_rocketjump_overbounce_explode_offset -1","Debug shows it always one usercmd earlier."]],"related":["mdd_rocketjump_overbounce","mdd_rocketjump_overbounce_debug"],"txt":"==============================================\nCVAR: mdd_rocketjump_overbounce_explode_offset\n==============================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n---------------------------------------------------\nmdd_rocketjump_overbounce_explode_offset <usercmds>\n---------------------------------------------------\n\n--------------\n1. Information\n--------------\nCalibration: shifts which usercmd the blast is assumed to follow for far-landing rockets.\n\n+mdd_rocketjump_overbounce: shifts which of your usercmds the blast is assumed to follow when the rocket lands beyond its first step. Default 0. Only for calibration: leave it alone unless the debug output shows \"blast seen after cmd N (planned M)\" consistently one off in the same direction.\n\nDefault: \"0\"   Added: 2026-11-10\n\n--------\n2. Notes\n--------\nPart of +mdd_rocketjump_overbounce; see that entry for the whole feature.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_rocketjump_overbounce_explode_offset 0\n    Default.\n\nmdd_rocketjump_overbounce_explode_offset 1\n    Debug shows the blast always one usercmd later than planned.\n\nmdd_rocketjump_overbounce_explode_offset -1\n    Debug shows it always one usercmd earlier.\n\n-----------\n4. See also\n-----------\n+mdd_rocketjump_overbounce, mdd_rocketjump_overbounce_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_rocketjump_overbounce_debug","shown":"mdd_rocketjump_overbounce_debug","kind":"cvar","group":"rjob","default":"0","added":"2026-11-10","addedNote":null,"usage":["mdd_rocketjump_overbounce_debug <0|1>"],"summary":"Console checks, RESULT line and rjob.log for every use.","sections":[["Information","+mdd_rocketjump_overbounce: 1 prints the chosen candidate, the checks against the server and a RESULT line for every use, and appends the full detail to rjob.log in the mod folder: the starting state and cvars, every usercmd sent (time, pmove slot, keys, view), the frames around the jump, and every server playerstate of the whole flight next to the predicted one."],["Notes","Part of +mdd_rocketjump_overbounce; see that entry for the whole feature."]],"examples":[["mdd_rocketjump_overbounce_debug 1","Turn it on, use the key a few times, read the RESULT lines."],["mdd_rocketjump_overbounce_debug 0","Off again: no console output, no log file."]],"related":["mdd_rocketjump_overbounce","mdd_rocketjump_overbounce_explode_offset"],"txt":"=====================================\nCVAR: mdd_rocketjump_overbounce_debug\n=====================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n-------------------------------------\nmdd_rocketjump_overbounce_debug <0|1>\n-------------------------------------\n\n--------------\n1. Information\n--------------\nConsole checks, RESULT line and rjob.log for every use.\n\n+mdd_rocketjump_overbounce: 1 prints the chosen candidate, the checks against the server and a RESULT line for every use, and appends the full detail to rjob.log in the mod folder: the starting state and cvars, every usercmd sent (time, pmove slot, keys, view), the frames around the jump, and every server playerstate of the whole flight next to the predicted one.\n\nDefault: \"0\"   Added: 2026-11-10\n\n--------\n2. Notes\n--------\nPart of +mdd_rocketjump_overbounce; see that entry for the whole feature.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_r
