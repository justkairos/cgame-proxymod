ocketjump_overbounce_debug 1\n    Turn it on, use the key a few times, read the RESULT lines.\n\nmdd_rocketjump_overbounce_debug 0\n    Off again: no console output, no log file.\n\n-----------\n4. See also\n-----------\n+mdd_rocketjump_overbounce, mdd_rocketjump_overbounce_explode_offset\nmdd_help mdd for the overview.\n"},{"name":"mdd_overbounce_jump","shown":"+mdd_overbounce_jump","kind":"button","group":"overbounce","default":null,"added":"2026-10-20","addedNote":null,"usage":["bind <key> +mdd_overbounce_jump"],"summary":"Jumps on the first usercmd after an overbounce landing gave you its speed.","sections":[["Information","While held: if you land with an overbounce, jumps in the usercmd right after the one that converted your fall speed into overbounce speed. Jumping any earlier would cancel the overbounce, so this is the earliest possible overbounce jump."],["How it decides","An overbounce landing is detected from the predicted player state: grounded while the z velocity is still large negative and still decreasing (a normal or slope landing always raises it). The next time the velocity changes the overbounce has happened; if you are still on the floor it taps jump. On tall overbounces the leftover upward velocity briefly flags you as jumping away; it waits up to 150 ms for the ground flag to return. Only horizontal (go) overbounces get a jump; a vertical one launches you anyway. mdd_overbounce_debug 1 prints what it saw."],["Notes","This is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs."]],"examples":[["bind space +mdd_overbounce_jump","Walk off a ledge at an overbounce height holding space: you jump with the full speed."],["bind space \"+mdd_overbounce_jump;+mdd_autojump\"","Overbounce jump when there is one, a normal landing jump otherwise."],["mdd_overbounce_debug 1","See whether a landing was recognised as an overbounce."]],"related":["mdd_overbounce_zero","mdd_overbounce_debug","mdd_autojump","mdd_rocketjump_overbounce"],"txt":"============================\nBUTTON: +mdd_overbounce_jump\n============================\n\n1. Information\n2. How it decides\n3. Notes\n4. Usage examples\n5. See also\n\n-------------------------------\nbind <key> +mdd_overbounce_jump\n-------------------------------\n\n--------------\n1. Information\n--------------\nJumps on the first usercmd after an overbounce landing gave you its speed.\n\nWhile held: if you land with an overbounce, jumps in the usercmd right after the one that converted your fall speed into overbounce speed. Jumping any earlier would cancel the overbounce, so this is the earliest possible overbounce jump.\n\nAdded: 2026-10-20\n\n-----------------\n2. How it decides\n-----------------\nAn overbounce landing is detected from the predicted player state: grounded while the z velocity is still large negative and still decreasing (a normal or slope landing always raises it). The next time the velocity changes the overbounce has happened; if you are still on the floor it taps jump. On tall overbounces the leftover upward velocity briefly flags you as jumping away; it waits up to 150 ms for the ground flag to return. Only horizontal (go) overbounces get a jump; a vertical one launches you anyway. mdd_overbounce_debug 1 prints what it saw.\n\n--------\n3. Notes\n--------\nThis is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs.\n\n-----------------\n4. Usage examples\n-----------------\nbind space +mdd_overbounce_jump\n    Walk off a ledge at an overbounce height holding space: you jump with the full speed.\n\nbind space \"+mdd_overbounce_jump;+mdd_autojump\"\n    Overbounce jump when there is one, a normal landing jump otherwise.\n\nmdd_overbounce_debug 1\n    See whether a landing was recognised as an overbounce.\n\n-----------\n5. See also\n-----------\n+mdd_overbounce_zero, mdd_overbounce_debug, +mdd_autojump, +mdd_rocketjump_overbounce\nmdd_help mdd for the overview.\n"},{"name":"mdd_overbounce_zero","shown":"+mdd_overbounce_zero","kind":"button","group":"overbounce","default":null,"added":"2026-10-20","addedNote":null,"usage":["bind <key> +mdd_overbounce_zero"],"summary":"Brings your horizontal velocity to exactly 0 in the air, for a vertical overbounce.","sections":[["Information","While held in the air: uses the movement keys to bring your horizontal velocity to EXACTLY 0 so the landing is a vertical overbounce. A vertical overbounce needs horizontal speed below 1 at the overbounce frame. Velocities are snapped to integers, so the last step is done walking (1.29 ups per frame: 1 -> 0) instead of running (2.56: 1 -> -2 -> 1 forever). On CPM it also ducks for the last few units.\n\nWorks best on VQ3. On CPM the side-strafe air acceleration can't settle near zero, so it only uses forward / back close in and may leave a sideways unit if you aren't looking roughly along your velocity."],["Notes","This is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs."]],"examples":[["bind mouse5 +mdd_overbounce_zero","Fall from an overbounce height holding mouse5 to bounce straight back up."],["bind mouse5 \"+mdd_overbounce_zero\"","After a straight-down +mdd_rocketjump_overbounce, hold it during the fall to keep the bounce vertical."]],"related":["mdd_overbounce_jump","mdd_overbounce_debug"],"txt":"============================\nBUTTON: +mdd_overbounce_zero\n============================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n-------------------------------\nbind <key> +mdd_overbounce_zero\n-------------------------------\n\n--------------\n1. Information\n--------------\nBrings your horizontal velocity to exactly 0 in the air, for a vertical overbounce.\n\nWhile held in the air: uses the movement keys to bring your horizontal velocity to EXACTLY 0 so the landing is a vertical overbounce. A vertical overbounce needs horizontal speed below 1 at the overbounce frame. Velocities are snapped to integers, so the last step is done walking (1.29 ups per frame: 1 -> 0) instead of running (2.56: 1 -> -2 -> 1 forever). On CPM it also ducks for the last few units.\n\nWorks best on VQ3. On CPM the side-strafe air acceleration can't settle near zero, so it only uses forward / back close in and may leave a sideways unit if you aren't looking roughly along your velocity.\n\nAdded: 2026-10-20\n\n--------\n2. Notes\n--------\nThis is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs.\n\n-----------------\n3. Usage examples\n-----------------\nbind mouse5 +mdd_overbounce_zero\n    Fall from an overbounce height holding mouse5 to bounce straight back up.\n\nbind mouse5 \"+mdd_overbounce_zero\"\n    After a straight-down +mdd_rocketjump_overbounce, hold it during the fall to keep the bounce vertical.\n\n-----------\n4. See also\n-----------\n+mdd_overbounce_jump, mdd_overbounce_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_overbounce_debug","shown":"mdd_overbounce_debug","kind":"cvar","group":"overbounce","default":"0","added":"2026-10-20","addedNote":null,"usage":["mdd_overbounce_debug <0|1>"],"summary":"Console output for the overbounce buttons.","sections":[["Information","Console output for +mdd_overbounce_jump: pending overbounce, overbounce speed, when the jump was pressed or why not."]],"examples":[["mdd_overbounce_debug 1","Check why an overbounce jump didn't happen."]],"related":["mdd_overbounce_jump","mdd_overbounce_zero"],"txt":"==========================\nCVAR: mdd_overbounce_debug\n==========================\n\n1. Information\n2. Usage examples\n3. See also\n\n--------------------------\nmdd_overbounce_debug <0|1>\n--------------------------\n\n--------------\n1. Information\n--------------\nConsole output for the overbounce buttons.\n\nConsole output for +mdd_overbounce_jump: pending overbounce, overbounce speed, when the jump was pressed or why not.\n\nDefault: \"0\"   Added: 2026-10-20\n\n-----------------\n2. Usage examples\n-----------------\nmdd_overbounce_debug 1\n    Check why an overbounce jump didn't happen.\n\n-----------\n3. See also\n-----------\n+mdd_overbounce_jump, +mdd_overbounce_zero\nmdd_help mdd for the overview.\n"},{"name":"mdd_autojump","shown":"+mdd_autojump","kind":"button","group":"overbounce","default":null,"added":"2026-10-23","addedNote":null,"usage":["bind <key> +mdd_autojump"],"summary":"Presses jump every time you land, in the landing usercmd itself.","sections":[["Information","While held, presses jump every time you are on the ground or about to land, so the jump goes out in the landing usercmd itself (what a frame-perfect manual jump does). Works in VQ3, where holding your own jump key does nothing, and in CPM."],["Timing","The press is sent as soon as you are grounded, or when the next usercmd is predicted to land. Each press is held for a random mdd_autojump_stagger_min..mdd_autojump_stagger_max ms (default 8..64), never shorter than needed to still be down when the landing usercmd runs. One jump per landing; being airborne re-arms it. If a jump didn't take (right after spawning the engine refuses jumps until attack is released) it tries again every 100 ms.\n\nIf you are hovering a fraction above walkable ground without being grounded (sticky overbounce) it keeps pressing jump until one lands. With the Flight powerup, as a free spectator or in noclip it simply holds jump down for as long as the key and that state last."],["Notes","mdd_autojump_debug 1 prints every press and, once released, the exact usercmd times. Movers (func_plat etc.) are not part of the landing prediction: on those the jump goes out one usercmd after landing.\n\nThis is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs."]],"examples":[["bind space +mdd_autojump","Hold space to bunny-hop: every landing is jumped on its own usercmd."],["bind space \"+mdd_overbounce_jump;+mdd_autojump\"","Also catch overbounce landings."],["mdd_autojump_stagger_min 16; mdd_autojump_stagger_max 48","Keep the jump key down 2-6 usercmds per press."],["bind space +mdd_autojump","In spectator or noclip the same key climbs."]],"related":["mdd_autojump_stagger_min","mdd_autojump_stagger_max","mdd_autojump_debug","mdd_overbounce_jump"],"txt":"=====================\nBUTTON: +mdd_autojump\n=====================\n\n1. Information\n2. Timing\n3. Notes\n4. Usage examples\n5. See also\n\n------------------------\nbind <key> +mdd_autojump\n------------------------\n\n--------------\n1. Information\n--------------\nPresses jump every time you land, in the landing usercmd itself.\n\nWhile held, presses jump every time you are on the ground or about to land, so the jump goes out in the landing usercmd itself (what a frame-perfect manual jump does). Works in VQ3, where holding your own jump key does nothing, and in CPM.\n\nAdded: 2026-10-23\n\n---------\n2. Timing\n---------\nThe press is sent as soon as you are grounded, or when the next usercmd is predicted to land. Each press is held for a random mdd_autojump_stagger_min..mdd_autojump_stagger_max ms (default 8..64), never shorter than needed to still be down when the landing usercmd runs. One jump per landing; being airborne re-arms it. If a jump didn't take (right after spawning the engine refuses jumps until attack is released) it tries again every 100 ms.\n\nIf you are hovering a fraction above walkable ground without being grounded (sticky overbounce) it keeps pressing jump until one lands. With the Flight powerup, as a free spectator or in noclip it simply holds jump down for as long as the key and that state last.\n\n--------\n3. Notes\n--------\nmdd_autojump_debug 1 prints every press and, once released, the exact usercmd times. Movers (func_plat etc.) are not part of the landing prediction: on those the jump goes out one usercmd after landing.\n\nThis is a hold button like +forward or +attack: bind it to a key and it is active while the key is held. Several can share one key, e.g. bind shift \"+mdd_grenade_chase;+mdd_grenade_aim\".\n\nEverything the proxymod does goes through the engine's own buttons (+forward, +moveup, +attack, +left, ...), so the server sees ordinary input and your physical keys keep working. Automated jump and attack presses are held a random mdd_input_stagger_min..max ms, a jump + attack pair is never sent in the same usercmd, and no timing pattern repeats within 256 pairs.\n\n-----------------\n4. Usage examples\n-----------------\nbind space +mdd_autojump\n    Hold space to bunny-hop: every landing is jumped on its own usercmd.\n\nbind space \"+mdd_overbounce_jump;+mdd_autojump\"\n    Also catch overbounce landings.\n\nmdd_autojump_stagger_min 16; mdd_autojump_stagger_max 48\n    Keep the jump key down 2-6 usercmds per press.\n\nbind space +mdd_autojump\n    In spectator or noclip the same key climbs.\n\n-----------\n5. See also\n-----------\nmdd_autojump_stagger_min, mdd_autojump_stagger_max, mdd_autojump_debug, +mdd_overbounce_jump\nmdd_help mdd for the overview.\n"},{"name":"mdd_autojump_stagger_min","shown":"mdd_autojump_stagger_min","kind":"cvar","group":"overbounce","default":"8","added":"2026-10-23","addedNote":null,"usage":["mdd_autojump_stagger_min <ms>","mdd_autojump_stagger_max <ms>"],"summary":"Shortest hold of an autojump press.","sections":[["Information","+mdd_autojump: the hold time of every jump press is drawn at random from mdd_autojump_stagger_min..mdd_autojump_stagger_max ms. Defaults 8 and 64. The hold is extended if needed so the key is still down in the landing usercmd."]],"examples":[["mdd_autojump_stagger_min 8; mdd_autojump_stagger_max 64","Defaults: 1 to 8 usercmds."],["mdd_autojump_stagger_min 24; mdd_autojump_stagger_max 24","Always exactly three usercmds (no randomization)."],["mdd_autojump_debug 1","Print the rolled and the real hold of every press."]],"related":["mdd_autojump_stagger_max","mdd_autojump","mdd_autojump_debug"],"txt":"==============================\nCVAR: mdd_autojump_stagger_min\n==============================\n\n1. Information\n2. Usage examples\n3. See also\n\n-----------------------------\nmdd_autojump_stagger_min <ms>\nmdd_autojump_stagger_max <ms>\n-----------------------------\n\n--------------\n1. Information\n--------------\nShortest hold of an autojump press.\n\n+mdd_autojump: the hold time of every jump press is drawn at random from mdd_autojump_stagger_min..mdd_autojump_stagger_max ms. Defaults 8 and 64. The hold is extended if needed so the key is still down in the landing usercmd.\n\nDefault: \"8\"   Added: 2026-10-23\n\n-----------------\n2. Usage examples\n-----------------\nmdd_autojump_stagger_min 8; mdd_autojump_stagger_max 64\n    Defaults: 1 to 8 usercmds.\n\nmdd_autojump_stagger_min 24; mdd_autojump_stagger_max 24\n    Always exactly three usercmds (no randomization).\n\nmdd_autojump_debug 1\n    Print the rolled and the real hold of every press.\n\n-----------\n3. See also\n-----------\nmdd_autojump_stagger_max, +mdd_autojump, mdd_autojump_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_autojump_stagger_max","shown":"mdd_autojump_stagger_max","kind":"cvar","group":"overbounce","default":"64","added":"2026-10-23","addedNote":null,"usage":["mdd_autojump_stagger_min <ms>","mdd_autojump_stagger_max <ms>"],"summary":"Longest hold of an autojump press.","sections":[["Information","+mdd_autojump: the hold time of every jump press is drawn at random from mdd_autojump_stagger_min..mdd_autojump_stagger_max ms. Defaults 8 and 64. The hold is extended if needed so the key is still down in the landing usercmd."]],"examples":[["mdd_autojump_stagger_max 64","Default."],["mdd_autojump_stagger_max 32","Shorter taps: at most four usercmds."]],"related":["mdd_autojump_stagger_min","mdd_autojump","mdd_autojump_debug"],"txt":"==============================\nCVAR: mdd_autojump_stagger_max\n==============================\n\n1. Information\n2. Usage examples\n3. See also\n\n-----------------------------\nmdd_autojump_stagger_min <ms>\nmdd_autojump_stagger_max <ms>\n-----------------------------\n\n--------------\n1. Information\n--------------\nLongest hold of an autojump press.\n\n+mdd_autojump: the hold time of every jump press is drawn at random from mdd_autojump_stagger_min..mdd_autojump_stagger_max ms. Defaults 8 and 64. The hold is extended if needed so the key is still down in the landing usercmd.\n\nDefault: \"64\"   Added: 2026-10-23\n\n-----------------\n2. Usage examples\n-----------------\nmdd_autojump_stagger_max 64\n    Default.\n\nmdd_autojump_stagger_max 32\n    Shorter taps: at most four usercmds.\n\n-----------\n3. See also\n-----------\nmdd_autojump_stagger_min, +mdd_autojump, mdd_autojump_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_autojump_debug","shown":"mdd_autojump_debug","kind":"cvar","group":"overbounce","default":"0","added":"2026-10-23","addedNote":null,"usage":["mdd_autojump_debug <0|1>"],"summary":"Prints every autojump press and its real hold.","sections":[["Information","+mdd_autojump: prints every jump press (grounded, hovering just above the ground, or predicted landing; fall speed; rolled hold) and, after the release, the usercmd times of +moveup / -moveup and the real hold length. Also prints retries and the spectator / noclip / flight hold."]],"examples":[["mdd_autojump_debug 1","Check the randomization, or why a jump was retried."]],"related":["mdd_autojump"],"txt":"========================\nCVAR: mdd_autojump_debug\n========================\n\n1. Information\n2. Usage examples\n3. See also\n\n------------------------\nmdd_autojump_debug <0|1>\n------------------------\n\n--------------\n1. Information\n--------------\nPrints every autojump press and its real hold.\n\n+mdd_autojump: prints every jump press (grounded, hovering just above the ground, or predicted landing; fall speed; rolled hold) and, after the release, the usercmd times of +moveup / -moveup and the real hold length. Also prints retries and the spectator / noclip / flight hold.\n\nDefault: \"0\"   Added: 2026-10-23\n\n-----------------\n2. Usage examples\n-----------------\nmdd_autojump_debug 1\n    Check the randomization, or why a jump was retried.\n\n-----------\n3. See also\n-----------\n+mdd_autojump\nmdd_help mdd for the overview.\n"},{"name":"mdd_replay_record","shown":"mdd_replay_record","kind":"command","group":"replay","default":null,"added":"2026-10-21","addedNote":null,"usage":["mdd_replay_record <name>"],"summary":"Records your input into a replay, starting from a saved position.","sections":[["Information","Starts recording your input into replay <name>. First it runs defrag's \"set saveposname <name>; savepos\" and stores the resulting start position in the replay, so mdd_replay_start can put you back there; your own saveposname is restored afterwards. savepos itself needs no cheats. Stand still when you start for an exact playback; stop with mdd_replay_stoprecord.\n\nName: any printable characters except spaces and / \\ : * ? \" < > | ; (it is also used as a cvar name by savepos). Defrag's autorecord demo names work as-is."],["Notes","Replays record your usercmds (movement keys, buttons, weapon, view angles) and play them back through the engine's own buttons. Files are plain text in defrag/replays/<name>.mdd.\n\nFor exact playback: com_maxfps 125 when recording and playing, timescale 1, pmove_fixed 1 with g_synchronousClients 0 (a local server with these settings is the ideal case; g_synchronousClients 1 samples your commands at the server's pace and is NOT reproducible). Hands off mouse and keys while it plays and don't hold other +mdd_ buttons. Your cl_yawspeed / cl_pitchspeed / cl_anglespeedkey are restored when it stops.\n\nView angles are reproduced exactly by 1 ms pulses of the keyboard-look buttons. With pmove_fixed, inputs are matched per 8 ms slot the way the server rounds them. On a remote server the first ~ping ms after a teleport are already sent before the proxymod can see the teleport, so those are your own input."]],"examples":[["mdd_replay_record jump1","Start recording from where you stand."],["mdd_replay_stoprecord","Stop and write defrag/replays/jump1.mdd."],["bind F5 \"mdd_replay_record run\"; bind F6 mdd_replay_stoprecord; bind F7 \"mdd_replay_start run\"","Record, stop and play back on three keys."]],"related":["mdd_replay_stoprecord","mdd_replay_start","mdd_replay_telerecord"],"txt":"==========================\nCOMMAND: mdd_replay_record\n==========================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n------------------------\nmdd_replay_record <name>\n------------------------\n\n--------------\n1. Information\n--------------\nRecords your input into a replay, starting from a saved position.\n\nStarts recording your input into replay <name>. First it runs defrag's \"set saveposname <name>; savepos\" and stores the resulting start position in the replay, so mdd_replay_start can put you back there; your own saveposname is restored afterwards. savepos itself needs no cheats. Stand still when you start for an exact playback; stop with mdd_replay_stoprecord.\n\nName: any printable characters except spaces and / \\ : * ? \" < > | ; (it is also used as a cvar name by savepos). Defrag's autorecord demo names work as-is.\n\nAdded: 2026-10-21\n\n--------\n2. Notes\n--------\nReplays record your usercmds (movement keys, buttons, weapon, view angles) and play them back through the engine's own buttons. Files are plain text in defrag/replays/<name>.mdd.\n\nFor exact playback: com_maxfps 125 when recording and playing, timescale 1, pmove_fixed 1 with g_synchronousClients 0 (a local server with these settings is the ideal case; g_synchronousClients 1 samples your commands at the server's pace and is NOT reproducible). Hands off mouse and keys while it plays and don't hold other +mdd_ buttons. Your cl_yawspeed / cl_pitchspeed / cl_anglespeedkey are restored when it stops.\n\nView angles are reproduced exactly by 1 ms pulses of the keyboard-look buttons. With pmove_fixed, inputs are matched per 8 ms slot the way the server rounds them. On a remote server the first ~ping ms after a teleport are already sent before the proxymod can see the teleport, so those are your own input.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_replay_record jump1\n    Start recording from where you stand.\n\nmdd_replay_stoprecord\n    Stop and write defrag/replays/jump1.mdd.\n\nbind F5 \"mdd_replay_record run\"; bind F6 mdd_replay_stoprecord; bind F7 \"mdd_replay_start run\"\n    Record, stop and play back on three keys.\n\n-----------\n4. See also\n-----------\nmdd_replay_stoprecord, mdd_replay_start, mdd_replay_telerecord\nmdd_help mdd for the overview.\n"},{"name":"mdd_replay_telerecord","shown":"mdd_replay_telerecord","kind":"command","group":"replay","default":null,"added":"2026-10-21","addedNote":null,"usage":["mdd_replay_telerecord <name>"],"summary":"Records a replay starting with the first usercmd after the next teleporter.","sections":[["Information","Starts recording replay <name> with the first usercmd after you exit the NEXT teleporter. The teleporter's destination is stored in the replay so mdd_replay_telestart only triggers on that same exit. The commands that were already in flight when the teleport showed up are pulled from the client's command buffer, so nothing is lost. No cheats involved. Stop with mdd_replay_stoprecord."],["Notes","Replays record your usercmds (movement keys, buttons, weapon, view angles) and play them back through the engine's own buttons. Files are plain text in defrag/replays/<name>.mdd.\n\nFor exact playback: com_maxfps 125 when recording and playing, timescale 1, pmove_fixed 1 with g_synchronousClients 0 (a local server with these settings is the ideal case; g_synchronousClients 1 samples your commands at the server's pace and is NOT reproducible). Hands off mouse and keys while it plays and don't hold other +mdd_ buttons. Your cl_yawspeed / cl_pitchspeed / cl_anglespeedkey are restored when it stops.\n\nView angles are reproduced exactly by 1 ms pulses of the keyboard-look buttons. With pmove_fixed, inputs are matched per 8 ms slot the way the server rounds them. On a remote server the first ~ping ms after a teleport are already sent before the proxymod can see the teleport, so those are your own input."]],"examples":[["mdd_replay_telerecord room2","Arm it, then walk into the teleporter: recording starts on the other side."],["mdd_replay_stoprecord","Stop and save."],["mdd_replay_telestart room2","Later: arm playback and go through the same teleporter."]],"related":["mdd_replay_telestart","mdd_replay_stoprecord","mdd_replay_record"],"txt":"==============================\nCOMMAND: mdd_replay_telerecord\n==============================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n----------------------------\nmdd_replay_telerecord <name>\n----------------------------\n\n--------------\n1. Information\n--------------\nRecords a replay starting with the first usercmd after the next teleporter.\n\nStarts recording replay <name> with the first usercmd after you exit the NEXT teleporter. The teleporter's destination is stored in the replay so mdd_replay_telestart only triggers on that same exit. The commands that were already in flight when the teleport showed up are pulled from the client's command buffer, so nothing is lost. No cheats involved. Stop with mdd_replay_stoprecord.\n\nAdded: 2026-10-21\n\n--------\n2. Notes\n--------\nReplays record your usercmds (movement keys, buttons, weapon, view angles) and play them back through the engine's own buttons. Files are plain text in defrag/replays/<name>.mdd.\n\nFor exact playback: com_maxfps 125 when recording and playing, timescale 1, pmove_fixed 1 with g_synchronousClients 0 (a local server with these settings is the ideal case; g_synchronousClients 1 samples your commands at the server's pace and is NOT reproducible). Hands off mouse and keys while it plays and don't hold other +mdd_ buttons. Your cl_yawspeed / cl_pitchspeed / cl_anglespeedkey are restored when it stops.\n\nView angles are reproduced exactly by 1 ms pulses of the keyboard-look buttons. With pmove_fixed, inputs are matched per 8 ms slot the way the server rounds them. On a remote server the first ~ping ms after a teleport are already sent before the proxymod can see the teleport, so those are your own input.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_replay_telerecord room2\n    Arm it, then walk into the teleporter: recording starts on the other side.\n\nmdd_replay_stoprecord\n    Stop and save.\n\nmdd_replay_telestart room2\n    Later: arm playback and go through the same teleporter.\n\n-----------\n4. See also\n-----------\nmdd_replay_telestart, mdd_replay_stoprecord, mdd_replay_record\nmdd_help mdd for the overview.\n"},{"name":"mdd_replay_stoprecord","shown":"mdd_replay_stoprecord","kind":"command","group":"replay","default":null,"added":"2026-10-21","addedNote":null,"usage":["mdd_replay_stoprecord"],"summary":"Stops recording and writes the replay file.","sections":[["Information","Stops the current recording and writes defrag/replays/<name>.mdd. Recording also stops by itself after 10 minutes (buffer full)."]],"examples":[["mdd_replay_stoprecord","Finish the replay started with mdd_replay_record or mdd_replay_telerecord."],["bind F6 mdd_replay_stoprecord","On a key."]],"related":["mdd_replay_record","mdd_replay_telerecord"],"txt":"==============================\nCOMMAND: mdd_replay_stoprecord\n==============================\n\n1. Information\n2. Usage examples\n3. See also\n\n---------------------\nmdd_replay_stoprecord\n---------------------\n\n--------------\n1. Information\n--------------\nStops recording and writes the replay file.\n\nStops the current recording and writes defrag/replays/<name>.mdd. Recording also stops by itself after 10 minutes (buffer full).\n\nAdded: 2026-10-21\n\n-----------------\n2. Usage examples\n-----------------\nmdd_replay_stoprecord\n    Finish the replay started with mdd_replay_record or mdd_replay_telerecord.\n\nbind F6 mdd_replay_stoprecord\n    On a key.\n\n-----------\n3. See also\n-----------\nmdd_replay_record, mdd_replay_telerecord\nmdd_help mdd for the overview.\n"},{"name":"mdd_replay_start","shown":"mdd_replay_start","kind":"command","group":"replay","default":null,"added":"2026-10-21","addedNote":null,"usage":["mdd_replay_start <name> [<name> ...]"],"summary":"Puts you at a replay's start position and plays its input.","sections":[["Information","Loads replay <name>, puts you at its stored start position (placeplayer, a server command that needs cheats) and starts feeding the recorded input as soon as the teleport shows up in a snapshot. Stops by itself at the end or with mdd_replay_stop. If cheats are off, placeplayer can't run, so the input is simply played from wherever you are standing, immediately. A replay recorded with telerecord started this way also just plays from here."],["Chaining","Several names can be given (up to 16): they play back to back, the next one's first usercmd following the previous one's last. Only the FIRST replay of a chain gets the start synchronisation; the rest just continue the input stream."],["Notes","Replays record your usercmds (movement keys, buttons, weapon, view angles) and play them back through the engine's own buttons. Files are plain text in defrag/replays/<name>.mdd.\n\nFor exact playback: com_maxfps 125 when recording and playing, timescale 1, pmove_fixed 1 with g_synchronousClients 0 (a local server with these settings is the ideal case; g_synchronousClients 1 samples your commands at the server's pace and is NOT reproducible). Hands off mouse and keys while it plays and don't hold other +mdd_ buttons. Your cl_yawspeed / cl_pitchspeed / cl_anglespeedkey are restored when it stops.\n\nView angles are reproduced exactly by 1 ms pulses of the keyboard-look buttons. With pmove_fixed, inputs are matched per 8 ms slot the way the server rounds them. On a remote server the first ~ping ms after a teleport are already sent before the proxymod can see the teleport, so those are your own input."]],"examples":[["mdd_replay_start jump1","Go back to where jump1 was recorded and replay it (needs cheats for the position)."],["mdd_replay_start part1 part2 part3","Play three replays back to back."],["devmap mymap; mdd_replay_start jump1","Load the map with cheats so the start position can be restored."]],"related":["mdd_replay_record","mdd_replay_stop","mdd_replay_telestart","mdd_replay_debug"],"txt":"=========================\nCOMMAND: mdd_replay_start\n=========================\n\n1. Information\n2. Chaining\n3. Notes\n4. Usage examples\n5. See also\n\n------------------------------------\nmdd_replay_start <name> [<name> ...]\n------------------------------------\n\n--------------\n1. Information\n--------------\nPuts you at a replay's start position and plays its input.\n\nLoads replay <name>, puts you at its stored start position (placeplayer, a server command that needs cheats) and starts feeding the recorded input as soon as the teleport shows up in a snapshot. Stops by itself at the end or with mdd_replay_stop. If cheats are off, placeplayer can't run, so the input is simply played from wherever you are standing, immediately. A replay recorded with telerecord started this way also just plays from here.\n\nAdded: 2026-10-21\n\n-----------\n2. Chaining\n-----------\nSeveral names can be given (up to 16): they play back to back, the next one's first usercmd following the previous one's last. Only the FIRST replay of a chain gets the start synchronisation; the rest just continue the input stream.\n\n--------\n3. Notes\n--------\nReplays record your usercmds (movement keys, buttons, weapon, view angles) and play them back through the engine's own buttons. Files are plain text in defrag/replays/<name>.mdd.\n\nFor exact playback: com_maxfps 125 when recording and playing, timescale 1, pmove_fixed 1 with g_synchronousClients 0 (a local server with these settings is the ideal case; g_synchronousClients 1 samples your commands at the server's pace and is NOT reproducible). Hands off mouse and keys while it plays and don't hold other +mdd_ buttons. Your cl_yawspeed / cl_pitchspeed / cl_anglespeedkey are restored when it stops.\n\nView angles are reproduced exactly by 1 ms pulses of the keyboard-look buttons. With pmove_fixed, inputs are matched per 8 ms slot the way the server rounds them. On a remote server the first ~ping ms after a teleport are already sent before the proxymod can see the teleport, so those are your own input.\n\n-----------------\n4. Usage examples\n-----------------\nmdd_replay_start jump1\n    Go back to where jump1 was recorded and replay it (needs cheats for the position).\n\nmdd_replay_start part1 part2 part3\n    Play three replays back to back.\n\ndevmap mymap; mdd_replay_start jump1\n    Load the map with cheats so the start position can be restored.\n\n-----------\n5. See also\n-----------\nmdd_replay_record, mdd_replay_stop, mdd_replay_telestart, mdd_replay_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_replay_telestart","shown":"mdd_replay_telestart","kind":"command","group":"replay","default":null,"added":"2026-10-21","addedNote":null,"usage":["mdd_replay_telestart <name> [<name> ...]"],"summary":"Plays a replay starting when you exit the teleporter it was recorded from.","sections":[["Information","Loads replay <name> and plays it back starting with the first usercmd after you exit the SAME teleporter it was recorded from. Teleports landing elsewhere (other teleporters, respawns) are ignored and it stays armed. No cheats needed. Meant for replays made with mdd_replay_telerecord; a replay made with mdd_replay_record has no exit position stored and triggers on the next teleport of any kind. Stop with mdd_replay_stop."],["Chaining","Several names can be given (up to 16): they play back to back; only the first waits for the teleporter."],["Notes","Replays record your usercmds (movement keys, buttons, weapon, view angles) and play them back through the engine's own buttons. Files are plain text in defrag/replays/<name>.mdd.\n\nFor exact playback: com_maxfps 125 when recording and playing, timescale 1, pmove_fixed 1 with g_synchronousClients 0 (a local server with these settings is the ideal case; g_synchronousClients 1 samples your commands at the server's pace and is NOT reproducible). Hands off mouse and keys while it plays and don't hold other +mdd_ buttons. Your cl_yawspeed / cl_pitchspeed / cl_anglespeedkey are restored when it stops.\n\nView angles are reproduced exactly by 1 ms pulses of the keyboard-look buttons. With pmove_fixed, inputs are matched per 8 ms slot the way the server rounds them. On a remote server the first ~ping ms after a teleport are already sent before the proxymod can see the teleport, so those are your own input."]],"examples":[["mdd_replay_telestart room2","Arm it and walk into the teleporter; the recorded input takes over on the other side."],["mdd_replay_telestart room2 room3","Chain a second replay straight after the first."],["mdd_replay_stop","Disarm it again."]],"related":["mdd_replay_telerecord","mdd_replay_stop","mdd_replay_start"],"txt":"=============================\nCOMMAND: mdd_replay_telestart\n=============================\n\n1. Information\n2. Chaining\n3. Notes\n4. Usage examples\n5. See also\n\n----------------------------------------\nmdd_replay_telestart <name> [<name> ...]\n----------------------------------------\n\n--------------\n1. Information\n--------------\nPlays a replay starting when you exit the teleporter it was recorded from.\n\nLoads replay <name> and plays it back starting with the first usercmd after you exit the SAME teleporter it was recorded from. Teleports landing elsewhere (other teleporters, respawns) are ignored and it stays armed. No cheats needed. Meant for replays made with mdd_replay_telerecord; a replay made with mdd_replay_record has no exit position stored and triggers on the next teleport of any kind. Stop with mdd_replay_stop.\n\nAdded: 2026-10-21\n\n-----------\n2. Chaining\n-----------\nSeveral names can be given (up to 16): they play back to back; only the first waits for the teleporter.\n\n--------\n3. Notes\n--------\nReplays record your usercmds (movement keys, buttons, weapon, view angles) and play them back through the engine's own buttons. Files are plain text in defrag/replays/<name>.mdd.\n\nFor exact playback: com_maxfps 125 when recording and playing, timescale 1, pmove_fixed 1 with g_synchronousClients 0 (a local server with these settings is the ideal case; g_synchronousClients 1 samples your commands at the server's pace and is NOT reproducible). Hands off mouse and keys while it plays and don't hold other +mdd_ buttons. Your cl_yawspeed / cl_pitchspeed / cl_anglespeedkey are restored when it stops.\n\nView angles are reproduced exactly by 1 ms pulses of the keyboard-look buttons. With pmove_fixed, inputs are matched per 8 ms slot the way the server rounds them. On a remote server the first ~ping ms after a teleport are already sent before the proxymod can see the teleport, so those are your own input.\n\n-----------------\n4. Usage examples\n-----------------\nmdd_replay_telestart room2\n    Arm it and walk into the teleporter; the recorded input takes over on the other side.\n\nmdd_replay_telestart room2 room3\n    Chain a second replay straight after the first.\n\nmdd_replay_stop\n    Disarm it again.\n\n-----------\n5. See also\n-----------\nmdd_replay_telerecord, mdd_replay_stop, mdd_replay_start\nmdd_help mdd for the overview.\n"},{"name":"mdd_replay_stop","shown":"mdd_replay_stop","kind":"command","group":"replay","default":null,"added":"2026-10-21","addedNote":null,"usage":["mdd_replay_stop"],"summary":"Stops or disarms playback.","sections":[["Information","Stops a running (or armed) playback, releases all keys and restores your cvars. Playback also stops by itself when the replay ends."]],"examples":[["mdd_replay_stop","Take control back."],["bind F8 mdd_replay_stop","Panic key."]],"related":["mdd_replay_start","mdd_replay_telestart"],"txt":"========================\nCOMMAND: mdd_replay_stop\n========================\n\n1. Information\n2. Usage examples\n3. See also\n\n---------------\nmdd_replay_stop\n---------------\n\n--------------\n1. Information\n--------------\nStops or disarms playback.\n\nStops a running (or armed) playback, releases all keys and restores your cvars. Playback also stops by itself when the replay ends.\n\nAdded: 2026-10-21\n\n-----------------\n2. Usage examples\n-----------------\nmdd_replay_stop\n    Take control back.\n\nbind F8 mdd_replay_stop\n    Panic key.\n\n-----------\n3. See also\n-----------\nmdd_replay_start, mdd_replay_telestart\nmdd_help mdd for the overview.\n"},{"name":"mdd_replay_debug","shown":"mdd_replay_debug","kind":"cvar","group":"replay","default":"0","added":"2026-10-21","addedNote":null,"usage":["mdd_replay_debug <0|1>"],"summary":"Console output about replay sync points.","sections":[["Information","Console output about replay sync points: when the teleport was seen, which serverTime recorded cmd 0 maps to, how many ms were skipped, grid vs time-based matching."]],"examples":[["mdd_replay_debug 1","Check why a playback started late or drifted."]],"related":["mdd_replay_start","mdd_replay_telestart"],"txt":"======================\nCVAR: mdd_replay_debug\n======================\n\n1. Information\n2. Usage examples\n3. See also\n\n----------------------\nmdd_replay_debug <0|1>\n----------------------\n\n--------------\n1. Information\n--------------\nConsole output about replay sync points.\n\nConsole output about replay sync points: when the teleport was seen, which serverTime recorded cmd 0 maps to, how many ms were skipped, grid vs time-based matching.\n\nDefault: \"0\"   Added: 2026-10-21\n\n-----------------\n2. Usage examples\n-----------------\nmdd_replay_debug 1\n    Check why a playback started late or drifted.\n\n-----------\n3. See also\n-----------\nmdd_replay_start, mdd_replay_telestart\nmdd_help mdd for the overview.\n"},{"name":"mdd_input_stagger_min","shown":"mdd_input_stagger_min","kind":"cvar","group":"input","default":"8","added":"2026-10-23","addedNote":null,"usage":["mdd_input_stagger_min <ms>","mdd_input_stagger_max <ms>"],"summary":"Lower end of the randomizer behind every automated jump and shot.","sections":[["Information","mdd_input_stagger_min..mdd_input_stagger_max is the one randomizer behind every automated jump and shot (+mdd_jumpshoot, +mdd_rocketsync, +mdd_rocketstack, mdd_grenade_jump / shoot / sync, +mdd_overbounce_jump, pad shots). Defaults 8 and 64.\n\nValues are whole usercmds: the range is rounded up to usercmd counts (8..64 = 1..8 usercmds at 125 fps) and every count is equally likely. Every automated key press is held for a random value from this range. When jump and attack are pressed as a pair (within 150 ms of each other), the second one is released a random value from this range AFTER the first one's release, and the press gap of +mdd_jumpshoot is drawn from it too. Two automated key events are never put in the same usercmd.\n\nThe (press gap, first hold, release gap) pattern of every pair is compared with the last 256 patterns and re-rolled, so no two jump + shots in a demo look alike."],["Notes","Replaces the old mdd_input_time / mdd_input_time_randomize. mdd_input_debug 1 prints the real usercmd times of every pair."]],"examples":[["mdd_input_stagger_min 8; mdd_input_stagger_max 64","Defaults."],["mdd_input_stagger_min 8; mdd_input_stagger_max 16","Tight: everything within one or two usercmds."],["mdd_input_debug 1","Print what was really sent."]],"related":["mdd_input_stagger_max","mdd_input_debug","mdd_jumpshoot"],"txt":"===========================\nCVAR: mdd_input_stagger_min\n===========================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n--------------------------\nmdd_input_stagger_min <ms>\nmdd_input_stagger_max <ms>\n--------------------------\n\n--------------\n1. Information\n--------------\nLower end of the randomizer behind every automated jump and shot.\n\nmdd_input_stagger_min..mdd_input_stagger_max is the one randomizer behind every automated jump and shot (+mdd_jumpshoot, +mdd_rocketsync, +mdd_rocketstack, mdd_grenade_jump / shoot / sync, +mdd_overbounce_jump, pad shots). Defaults 8 and 64.\n\nValues are whole usercmds: the range is rounded up to usercmd counts (8..64 = 1..8 usercmds at 125 fps) and every count is equally likely. Every automated key press is held for a random value from this range. When jump and attack are pressed as a pair (within 150 ms of each other), the second one is released a random value from this range AFTER the first one's release, and the press gap of +mdd_jumpshoot is drawn from it too. Two automated key events are never put in the same usercmd.\n\nThe (press gap, first hold, release gap) pattern of every pair is compared with the last 256 patterns and re-rolled, so no two jump + shots in a demo look alike.\n\nDefault: \"8\"   Added: 2026-10-23\n\n--------\n2. Notes\n--------\nReplaces the old mdd_input_time / mdd_input_time_randomize. mdd_input_debug 1 prints the real usercmd times of every pair.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_input_stagger_min 8; mdd_input_stagger_max 64\n    Defaults.\n\nmdd_input_stagger_min 8; mdd_input_stagger_max 16\n    Tight: everything within one or two usercmds.\n\nmdd_input_debug 1\n    Print what was really sent.\n\n-----------\n4. See also\n-----------\nmdd_input_stagger_max, mdd_input_debug, +mdd_jumpshoot\nmdd_help mdd for the overview.\n"},{"name":"mdd_input_stagger_max","shown":"mdd_input_stagger_max","kind":"cvar","group":"input","default":"64","added":"2026-10-23","addedNote":null,"usage":["mdd_input_stagger_min <ms>","mdd_input_stagger_max <ms>"],"summary":"Upper end of the randomizer behind every automated jump and shot.","sections":[["Information","Upper end of the range every automated key hold, release stagger and jump-shot press gap is drawn from. See mdd_input_stagger_min for the full description. Default 64 (8 usercmds at 125 fps)."]],"examples":[["mdd_input_stagger_max 64","Default."],["mdd_input_stagger_max 32","Faster key releases: at most four usercmds."]],"related":["mdd_input_stagger_min","mdd_input_debug"],"txt":"===========================\nCVAR: mdd_input_stagger_max\n===========================\n\n1. Information\n2. Usage examples\n3. See also\n\n--------------------------\nmdd_input_stagger_min <ms>\nmdd_input_stagger_max <ms>\n--------------------------\n\n--------------\n1. Information\n--------------\nUpper end of the randomizer behind every automated jump and shot.\n\nUpper end of the range every automated key hold, release stagger and jump-shot press gap is drawn from. See mdd_input_stagger_min for the full description. Default 64 (8 usercmds at 125 fps).\n\nDefault: \"64\"   Added: 2026-10-23\n\n-----------------\n2. Usage examples\n-----------------\nmdd_input_stagger_max 64\n    Default.\n\nmdd_input_stagger_max 32\n    Faster key releases: at most four usercmds.\n\n-----------\n3. See also\n-----------\nmdd_input_stagger_min, mdd_input_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_input_debug","shown":"mdd_input_debug","kind":"cvar","group":"input","default":"0","added":"2026-10-23","addedNote":null,"usage":["mdd_input_debug <0|1|2>"],"summary":"Prints the real usercmd times of automated key presses.","sections":[["Information","1: after every automated jump + attack pair has been released, prints the usercmd times of the four events, how long each key was held, the press gap and the release gap (and the gap that was rolled), whatever feature sent them.\n\n2: also prints every single automated tap (pad shots, autojump, lone jumps) with its press and release times."]],"examples":[["mdd_input_debug 1","Verify the stagger of jump + shot pairs before recording a demo."],["mdd_input_debug 2","Include single taps."]],"related":["mdd_input_stagger_min","mdd_jumpshoot_debug"],"txt":"=====================\nCVAR: mdd_input_debug\n=====================\n\n1. Information\n2. Usage examples\n3. See also\n\n-----------------------\nmdd_input_debug <0|1|2>\n-----------------------\n\n--------------\n1. Information\n--------------\nPrints the real usercmd times of automated key presses.\n\n1: after every automated jump + attack pair has been released, prints the usercmd times of the four events, how long each key was held, the press gap and the release gap (and the gap that was rolled), whatever feature sent them.\n\n2: also prints every single automated tap (pad shots, autojump, lone jumps) with its press and release times.\n\nDefault: \"0\"   Added: 2026-10-23\n\n-----------------\n2. Usage examples\n-----------------\nmdd_input_debug 1\n    Verify the stagger of jump + shot pairs before recording a demo.\n\nmdd_input_debug 2\n    Include single taps.\n\n-----------\n3. See also\n-----------\nmdd_input_stagger_min, mdd_jumpshoot_debug\nmdd_help mdd for the overview.\n"},{"name":"mdd_yaw","shown":"mdd_yaw","kind":"cvar","group":"hud","default":"","added":"2026-10-29","addedNote":null,"usage":["mdd_yaw <angle> [<angle> ...]"],"summary":"Marks yaw angles on screen with vertical lines, like mdd_pitch does for pitch.","sections":[["Information","Marks one or more absolute yaw angles with a vertical line where that heading projects on screen, the yaw counterpart of mdd_pitch. Empty = off. Position and size come from mdd_yaw_ywh, the colour from mdd_yaw_rgba."]],"examples":[["mdd_yaw 90 270","Mark north and south."],["mdd_yaw 0 90 180 270","Mark all four axis directions, e.g. to find the quadrant for a rocket or plasma overbounce."],["mdd_yaw \"\"","Off."]],"related":["mdd_yaw_ywh","mdd_yaw_rgba"],"txt":"=============\nCVAR: mdd_yaw\n=============\n\n1. Information\n2. Usage examples\n3. See also\n\n-----------------------------\nmdd_yaw <angle> [<angle> ...]\n-----------------------------\n\n--------------\n1. Information\n--------------\nMarks yaw angles on screen with vertical lines, like mdd_pitch does for pitch.\n\nMarks one or more absolute yaw angles with a vertical line where that heading projects on screen, the yaw counterpart of mdd_pitch. Empty = off. Position and size come from mdd_yaw_ywh, the colour from mdd_yaw_rgba.\n\nDefault: \"\"   Added: 2026-10-29\n\n-----------------\n2. Usage examples\n-----------------\nmdd_yaw 90 270\n    Mark north and south.\n\nmdd_yaw 0 90 180 270\n    Mark all four axis directions, e.g. to find the quadrant for a rocket or plasma overbounce.\n\nmdd_yaw \"\"\n    Off.\n\n-----------\n3. See also\n-----------\nmdd_yaw_ywh, mdd_yaw_rgba\nmdd_help mdd for the overview.\n"},{"name":"mdd_yaw_ywh","shown":"mdd_yaw_ywh","kind":"cvar","group":"hud","default":"236 1 8","added":"2026-10-29","addedNote":null,"usage":["mdd_yaw_ywh <y> <width> <height>"],"summary":"Position and size of the mdd_yaw lines.","sections":[["Information","Where the mdd_yaw lines are drawn: y of the top edge, line width and line height, in the 640x480 virtual screen. Default 236 1 8 (a short tick at the crosshair)."]],"examples":[["mdd_yaw_ywh 236 1 8","Default tick at crosshair height."],["mdd_yaw_ywh 0 1 480","Full-height lines."],["mdd_yaw_ywh 200 2 80","Thicker, taller marks."]],"related":["mdd_yaw","mdd_yaw_rgba"],"txt":"=================\nCVAR: mdd_yaw_ywh\n=================\n\n1. Information\n2. Usage examples\n3. See also\n\n--------------------------------\nmdd_yaw_ywh <y> <width> <height>\n--------------------------------\n\n--------------\n1. Information\n--------------\nPosition and size of the mdd_yaw lines.\n\nWhere the mdd_yaw lines are drawn: y of the top edge, line width and line height, in the 640x480 virtual screen. Default 236 1 8 (a short tick at the crosshair).\n\nDefault: \"236 1 8\"   Added: 2026-10-29\n\n-----------------\n2. Usage examples\n-----------------\nmdd_yaw_ywh 236 1 8\n    Default tick at crosshair height.\n\nmdd_yaw_ywh 0 1 480\n    Full-height lines.\n\nmdd_yaw_ywh 200 2 80\n    Thicker, taller marks.\n\n-----------\n3. See also\n-----------\nmdd_yaw, mdd_yaw_rgba\nmdd_help mdd for the overview.\n"},{"name":"mdd_yaw_rgba","shown":"mdd_yaw_rgba","kind":"cvar","group":"hud","default":".8 .8 .8 .8","added":"2026-10-29","addedNote":null,"usage":["mdd_yaw_rgba <r> <g> <b> <a>"],"summary":"Colour of the mdd_yaw lines.","sections":[["Information","Colour and opacity of the mdd_yaw lines, each 0..1. Default .8 .8 .8 .8."]],"examples":[["mdd_yaw_rgba 1 0 0 1","Solid red."],["mdd_yaw_rgba .8 .8 .8 .4","Faint grey."]],"related":["mdd_yaw","mdd_yaw_ywh"],"txt":"==================\nCVAR: mdd_yaw_rgba\n==================\n\n1. Information\n2. Usage examples\n3. See also\n\n----------------------------\nmdd_yaw_rgba <r> <g> <b> <a>\n----------------------------\n\n--------------\n1. Information\n--------------\nColour of the mdd_yaw lines.\n\nColour and opacity of the mdd_yaw lines, each 0..1. Default .8 .8 .8 .8.\n\nDefault: \".8 .8 .8 .8\"   Added: 2026-10-29\n\n-----------------\n2. Usage examples\n-----------------\nmdd_yaw_rgba 1 0 0 1\n    Solid red.\n\nmdd_yaw_rgba .8 .8 .8 .4\n    Faint grey.\n\n-----------\n3. See also\n-----------\nmdd_yaw, mdd_yaw_ywh\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_strafe_modes","shown":"mdd_player_trajectory_strafe_modes","kind":"cvar","group":"trajectory","default":"0b010","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_strafe_modes <0bXXX>"],"summary":"Which predicted trajectories to draw (also the on/off switch).","sections":[["Information","Bitmask of the simulated models to draw; 0 = off.\n\n1 (0b001) passive: no input except jumps, gravity and collision only.\n\n2 (0b010) accel: assumes you keep aiming at the same relative position inside the accel zone as now, i.e. where your jumps will land with your current input.\n\n4 (0b100) strafebot: ideal strafing with your current keys; the theoretical best."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_strafe_modes 0b010","Default: your current-input prediction."],["mdd_player_trajectory_strafe_modes 0b110","Yours and the strafebot's, to compare."],["mdd_player_trajectory_strafe_modes 0","Off."]],"related":["mdd_player_trajectory_display_type","mdd_player_trajectory_frames"],"txt":"========================================\nCVAR: mdd_player_trajectory_strafe_modes\n========================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n------------------------------------------\nmdd_player_trajectory_strafe_modes <0bXXX>\n------------------------------------------\n\n--------------\n1. Information\n--------------\nWhich predicted trajectories to draw (also the on/off switch).\n\nBitmask of the simulated models to draw; 0 = off.\n\n1 (0b001) passive: no input except jumps, gravity and collision only.\n\n2 (0b010) accel: assumes you keep aiming at the same relative position inside the accel zone as now, i.e. where your jumps will land with your current input.\n\n4 (0b100) strafebot: ideal strafing with your current keys; the theoretical best.\n\nDefault: \"0b010\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_strafe_modes 0b010\n    Default: your current-input prediction.\n\nmdd_player_trajectory_strafe_modes 0b110\n    Yours and the strafebot's, to compare.\n\nmdd_player_trajectory_strafe_modes 0\n    Off.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_display_type, mdd_player_trajectory_frames\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_display_type","shown":"mdd_player_trajectory_display_type","kind":"cvar","group":"trajectory","default":"0b11110","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_display_type <0bXXXXX>"],"summary":"How the predicted trajectory is drawn.","sections":[["Information","Bitmask.\n\n1 full bounding boxes.\n\n2 bottom squares only (a flat footprint).\n\n4 jump and teleport-enter frames always as full boxes.\n\n8 a connecting line through every simulated frame.\n\n16 static, world-pinned samples instead of flowing ones (only while you are airborne)."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_display_type 0b11110","Default: footprints, jump boxes, line, static."],["mdd_player_trajectory_display_type 0b01000","Line only."],["mdd_player_trajectory_display_type 0b00101","Full boxes."]],"related":["mdd_player_trajectory_strafe_modes","mdd_player_trajectory_step"],"txt":"========================================\nCVAR: mdd_player_trajectory_display_type\n========================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n--------------------------------------------\nmdd_player_trajectory_display_type <0bXXXXX>\n--------------------------------------------\n\n--------------\n1. Information\n--------------\nHow the predicted trajectory is drawn.\n\nBitmask.\n\n1 full bounding boxes.\n\n2 bottom squares only (a flat footprint).\n\n4 jump and teleport-enter frames always as full boxes.\n\n8 a connecting line through every simulated frame.\n\n16 static, world-pinned samples instead of flowing ones (only while you are airborne).\n\nDefault: \"0b11110\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_display_type 0b11110\n    Default: footprints, jump boxes, line, static.\n\nmdd_player_trajectory_display_type 0b01000\n    Line only.\n\nmdd_player_trajectory_display_type 0b00101\n    Full boxes.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_strafe_modes, mdd_player_trajectory_step\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_frames","shown":"mdd_player_trajectory_frames","kind":"cvar","group":"trajectory","default":"270","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_frames <count>"],"summary":"How many frames ahead to predict.","sections":[["Information","Number of simulated frames (8 ms each). Default 270, capped at 2000. Cost grows with it."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_frames 270","Default, a little over two seconds."],["mdd_player_trajectory_frames 125","One second: cheaper."]],"related":["mdd_player_trajectory_step","mdd_player_trajectory_trace_entities"],"txt":"==================================\nCVAR: mdd_player_trajectory_frames\n==================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n------------------------------------\nmdd_player_trajectory_frames <count>\n------------------------------------\n\n--------------\n1. Information\n--------------\nHow many frames ahead to predict.\n\nNumber of simulated frames (8 ms each). Default 270, capped at 2000. Cost grows with it.\n\nDefault: \"270\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_frames 270\n    Default, a little over two seconds.\n\nmdd_player_trajectory_frames 125\n    One second: cheaper.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_step, mdd_player_trajectory_trace_entities\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_step","shown":"mdd_player_trajectory_step","kind":"cvar","group":"trajectory","default":"10","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_step <count>"],"summary":"Draw a sample every N simulated frames.","sections":[["Information","Draw a sample every N simulated frames. Jump and teleport-enter frames are always drawn. The connecting line ignores this."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_step 10","Default."],["mdd_player_trajectory_step 5","Denser samples."]],"related":["mdd_player_trajectory_frames","mdd_player_trajectory_display_type"],"txt":"================================\nCVAR: mdd_player_trajectory_step\n================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n----------------------------------\nmdd_player_trajectory_step <count>\n----------------------------------\n\n--------------\n1. Information\n--------------\nDraw a sample every N simulated frames.\n\nDraw a sample every N simulated frames. Jump and teleport-enter frames are always drawn. The connecting line ignores this.\n\nDefault: \"10\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_step 10\n    Default.\n\nmdd_player_trajectory_step 5\n    Denser samples.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_frames, mdd_player_trajectory_display_type\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_trace_entities","shown":"mdd_player_trajectory_trace_entities","kind":"cvar","group":"trajectory","default":"1","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_trace_entities <0|1>"],"summary":"Also collide the prediction with doors, plats and other brush entities.","sections":[["Information","1: also trace against the solid brush entities in your snapshot (doors, plats, trains, buttons), not just the world. Costs frame rate on entity-heavy maps; set 0 there. Moving entities are traced where they were last seen."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_trace_entities 0","Frame rate drops on a map full of doors: world only."],["mdd_player_trajectory_trace_entities 1","Default."]],"related":["mdd_player_trajectory_trace_triggers","mdd_player_trajectory_frames"],"txt":"==========================================\nCVAR: mdd_player_trajectory_trace_entities\n==========================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n------------------------------------------\nmdd_player_trajectory_trace_entities <0|1>\n------------------------------------------\n\n--------------\n1. Information\n--------------\nAlso collide the prediction with doors, plats and other brush entities.\n\n1: also trace against the solid brush entities in your snapshot (doors, plats, trains, buttons), not just the world. Costs frame rate on entity-heavy maps; set 0 there. Moving entities are traced where they were last seen.\n\nDefault: \"1\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_trace_entities 0\n    Frame rate drops on a map full of doors: world only.\n\nmdd_player_trajectory_trace_entities 1\n    Default.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_trace_triggers, mdd_player_trajectory_frames\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_trace_triggers","shown":"mdd_player_trajectory_trace_triggers","kind":"cvar","group":"trajectory","default":"1","added":"2026-10-27","addedNote":"written 2026-08-28 by akuzmichov, merged into the fork 2026-10-27","usage":["mdd_player_trajectory_trace_triggers <0|1>"],"summary":"Apply jump pads and stop at teleporters in the prediction.","sections":[["Information","1: jump pads apply their real push to the prediction, and a teleporter highlights the frame that touches it and ends the prediction there (the destination isn't known to the client)."],["Notes","Part of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository."]],"examples":[["mdd_player_trajectory_trace_triggers 1","Default."],["mdd_player_trajectory_trace_triggers 0","Ignore pads and teleporters."]],"related":["mdd_player_trajectory_trace_entities","mdd_player_trajectory_rgba_trigger"],"txt":"==========================================\nCVAR: mdd_player_trajectory_trace_triggers\n==========================================\n\n1. Information\n2. Notes\n3. Usage examples\n4. See also\n\n------------------------------------------\nmdd_player_trajectory_trace_triggers <0|1>\n------------------------------------------\n\n--------------\n1. Information\n--------------\nApply jump pads and stop at teleporters in the prediction.\n\n1: jump pads apply their real push to the prediction, and a teleporter highlights the frame that touches it and ends the prediction there (the destination isn't known to the client).\n\nDefault: \"1\"   Added: 2026-10-27 (written 2026-08-28 by akuzmichov)\n\n--------\n2. Notes\n--------\nPart of the predicted player trajectory by akuzmichov (merged from github.com/akuzmichov/cgame-proxymod, branch player_trajectory). The full reference is docs/mdd_player_trajectory.md in the repository.\n\n-----------------\n3. Usage examples\n-----------------\nmdd_player_trajectory_trace_triggers 1\n    Default.\n\nmdd_player_trajectory_trace_triggers 0\n    Ignore pads and teleporters.\n\n-----------\n4. See also\n-----------\nmdd_player_trajectory_trace_entities, mdd_player_trajectory_rgba_trigger\nmdd_help mdd for the overview.\n"},{"name":"mdd_player_trajectory_rgba_passive","shown":
